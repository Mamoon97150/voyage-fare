<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menus and Your trips (v6, 16 Nov)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      body { background: #e9e2d3; }
      .d-frames { display: grid; gap: 3.5rem; padding: 2.5rem 0 5rem; justify-items: center; }
      .d-frame { width: 1280px; }
      .d-screen { position: relative; height: 800px; overflow: hidden; background: var(--paper); border-radius: 12px; box-shadow: 0 10px 40px rgb(44 38 32 / .18); border: 1px solid #d8ccb4; }
      .d-frame figcaption { max-width: 60rem; margin: 1rem auto 0; font-size: .9rem; color: var(--ink-soft); line-height: 1.5; }
      .d-frame figcaption b { color: var(--ink); }
      .d-frame figcaption ul { margin: .4rem 0 0; padding-left: 1.2rem; }
      .d-hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .d-num { font-variant-numeric: tabular-nums; }
      .d-caps { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }

      /* three columns */
      .d-desk { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; gap: 28px; height: 100%; padding: 0 28px 0 0; }
      .d-desk--two { grid-template-columns: 220px minmax(0, 1fr); }
      .d-side { padding: 26px 0 26px 26px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; background: color-mix(in srgb, var(--paper-raised) 60%, var(--paper)); }
      .d-brand { display: flex; align-items: center; gap: .5rem; font-family: var(--font-title); font-weight: 600; font-size: 1.1rem; }
      .d-brand i { font-style: normal; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: .8rem; }
      .d-back { font-size: var(--text-sm); color: var(--ink-soft); }
      .d-trip-name { font-family: var(--font-title); font-size: 1.45rem; font-weight: 600; line-height: 1.15; padding-right: 18px; }
      .d-trip-name small { display: block; font-family: var(--font-hand); font-weight: 400; font-size: 1.05rem; color: var(--ink-soft); margin-top: 2px; }
      .d-nav { display: grid; gap: 2px; padding-right: 14px; }
      .d-nav a { display: flex; align-items: center; gap: .6rem; padding: .55rem .7rem; border-radius: 8px; font-size: var(--text-md); color: var(--ink-soft); }
      .d-nav a.d-on { color: var(--ink); font-weight: 700; background: var(--paper-raised); box-shadow: inset 3px 0 0 var(--ink); }
      .d-nav a span { width: 1.2rem; text-align: center; }
      .d-people { display: flex; gap: 4px; }
      .d-av { width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--paper-raised); border: 1.5px solid var(--line); }
      .d-av--me { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      .d-menu { display: grid; gap: .1rem; font-size: var(--text-sm); color: var(--ink-soft); padding-right: 14px; }
      .d-menu span { padding: .35rem .7rem; }
      .d-side .d-push { margin-top: auto; font-size: var(--text-sm); color: var(--ink-soft); display: flex; align-items: center; gap: .5rem; }

      .d-mid { overflow: hidden; padding: 26px 0; }
      .d-mid-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
      .d-mid-head h1 { font-family: var(--font-title); font-size: 1.6rem; }
      .d-chips { display: flex; gap: 6px; }

      .d-ticket { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 16px; margin: 10px 0; border: 1.5px dashed var(--line); border-radius: 10px; font-size: var(--text-md); }
      .d-ticket small { display: block; color: var(--ink-soft); font-size: var(--text-xs); }
      .d-place { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
      .d-place-head { display: flex; align-items: center; gap: 10px; }
      .d-place-head h2 { font-family: var(--font-title); font-size: 1.35rem; font-weight: 600; }
      .d-place-head .d-n { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
      .d-place-head small { font-size: var(--text-xs); color: var(--ink-soft); }
      .d-place-head b { margin-left: auto; font-family: var(--font-title); font-size: 1.2rem; }
      .d-grp { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
      .d-grp--on { border-bottom: 2px solid var(--ink); }
      .d-grp--on .d-caps { color: var(--ink); }
      .d-ln { display: grid; grid-template-columns: 1.3rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); }
      .d-ln--photo { grid-template-columns: 3.6rem minmax(0, 1fr) auto; }
      .d-ln--open { background: color-mix(in srgb, var(--ink) 6%, transparent); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; box-shadow: inset 3px 0 0 var(--ink); }
      .d-ln small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .d-ln b { font-weight: 600; }
      .d-dot { width: .6rem; height: .6rem; border-radius: 50%; justify-self: center; }
      .d-dot--ok { background: var(--confirmed); }
      .d-dot--est { background: var(--estimated); }
      .d-dot--none { border: 1.5px solid var(--ink-soft); }
      .d-mk { width: 1.3rem; height: 1.3rem; border-radius: 50%; display: grid; place-items: center; font-size: .68rem; font-weight: 700; color: var(--paper); }
      .d-mk--act { background: var(--cat-activity); }
      .d-mk--food { background: var(--cat-food); }
      .d-prompts { display: flex; justify-content: space-evenly; padding: 4px 0; font-size: var(--text-sm); color: var(--ink-soft); }
      .d-maptag { font-size: var(--text-xs); font-weight: 600; padding: .1rem .55rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); }
      .d-maptag--on { border-color: var(--ink); }
      .d-photo { position: relative; display: block; border-radius: 2px; background-size: cover; box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
      .d-photo::before, .d-photo::after, .d-photo i::before, .d-photo i::after { content: ''; position: absolute; width: 12px; height: 12px; background: color-mix(in srgb, var(--ink) 78%, transparent); }
      .d-photo::before { top: -3px; left: -3px; clip-path: polygon(0 0, 100% 0, 0 100%); }
      .d-photo::after { bottom: -3px; right: -3px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
      .d-photo i::before { top: -3px; right: -3px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
      .d-photo i::after { bottom: -3px; left: -3px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
      .d-ph-a { background-image: linear-gradient(180deg, #c9b38a 0 30%, #8a6d48 30% 33%, #e6d7b5 33% 62%, #6e7f4c 62% 66%, #d7c79f 66%); }
      .d-ph-b { background-image: linear-gradient(160deg, #e9d9bf 0 38%, #c8a982 38% 41%, #f2e6d3 41% 70%, #9d7a55 70% 74%, #e3cfae 74%); }
      .d-ph-c { background-image: linear-gradient(200deg, #dfe3e4 0 45%, #a9b6b9 45% 48%, #eef0ee 48% 72%, #7b8a8f 72% 76%, #d8dcd8 76%); }
      .d-ph-d { background-image: linear-gradient(180deg, #e6c9a8 0 35%, #b5653f 35% 55%, #2c2620 55% 58%, #d9b991 58%); }
      .d-ln--photo .d-photo { height: 2.7rem; transform: rotate(-2deg); }

      /* right column */
      .d-right { padding: 26px 0; display: flex; flex-direction: column; gap: 14px; }
      .d-budget { padding: 14px 16px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; }
      .d-budget .d-fig { display: flex; justify-content: space-between; align-items: baseline; }
      .d-budget .d-fig b { font-family: var(--font-title); font-size: 2rem; }
      .d-bar { position: relative; height: 12px; margin: 10px 0 6px; border-radius: 6px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
      .d-bar i { position: absolute; top: 0; bottom: 0; }
      .d-bar .d-c { left: 0; width: 46%; background: var(--confirmed); }
      .d-bar .d-e { left: 46%; width: 28%; background: var(--estimated); }
      .d-budget p { font-size: var(--text-xs); color: var(--ink-soft); display: flex; justify-content: space-between; }
      .d-mapcard { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      .d-mapcard h3 { display: flex; flex-direction: column; gap: 2px; font-family: var(--font-title); font-size: 1.1rem; margin-bottom: 8px; }
      .d-mapcard h3 span { font-family: var(--font-text); font-size: var(--text-xs); color: var(--ink-soft); font-weight: 400; }
      .d-map { height: 290px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #f3eee2; z-index: 0; position: relative; }
      .d-map .leaflet-tile-pane { filter: grayscale(1) sepia(0.35) contrast(0.85) brightness(1.06); }
      .d-map .leaflet-control-attribution { font-size: 9px; background: rgb(251 247 239 / 0.8); }
      .d-pin { width: 22px; height: 22px; border-radius: 50%; color: #fbf7ef; font: 700 11px/22px var(--font-text); text-align: center; box-shadow: 0 0 0 2px #fbf7ef; }
      .d-pin--act { background: #dc9a7c; } .d-pin--food { background: #b6bf86; } .d-pin--stay { background: var(--ink); font-size: 13px; }
      .d-price-pin { display: inline-block; transform: translate(-50%, -50%); padding: 2px 7px; border-radius: 999px; background: #fbf7ef; border: 1.5px solid var(--ink); font: 700 11px/16px var(--font-text); color: var(--ink); white-space: nowrap; }
      .d-price-pin--on { background: var(--ink); color: #fbf7ef; }
      .d-price-pin--chosen { border-color: var(--pen); box-shadow: 0 0 0 2px rgb(51 80 140 / .25); }
      .d-left-list { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: var(--text-sm); }
      .d-left-list div { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); }
      .d-left-list div:first-of-type { border-top: 0; }

      /* side panel (a line opened) */
      .d-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: var(--paper-raised); border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgb(44 38 32 / .12); padding: 22px 24px; display: flex; flex-direction: column; }
      .d-panel-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; }
      .d-panel-head h3 { font-family: var(--font-title); font-size: 1.5rem; font-weight: 600; }
      .d-panel-head b { font-family: var(--font-title); font-size: 1.5rem; }
      .d-panel-head .d-x { width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; }
      .d-panel-head p { grid-column: 1 / -1; font-size: var(--text-sm); color: var(--ink-soft); }
      .d-track { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; position: relative; }
      .d-track::before { content: ''; position: absolute; left: 16%; right: 16%; top: .55rem; border-top: 2px dashed var(--line); }
      .d-stp { display: grid; justify-items: center; gap: .3rem; font-size: var(--text-xs); color: var(--ink-soft); position: relative; }
      .d-stp i { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--line); background: var(--paper-raised); }
      .d-stp.d-on i { border-color: var(--estimated); background: var(--estimated); }
      .d-stp.d-on { color: var(--ink); font-weight: 600; }
      .d-panel .button--primary { width: 100%; margin-top: 18px; }
      .d-rows { margin-top: 18px; border-top: 1px solid var(--line); }
      .d-r { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 3rem; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
      .d-r small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .d-panel .d-minimap { height: 170px; margin-top: 18px; }
      .dim { position: absolute; inset: 0; background: rgb(44 38 32 / .06); }

      /* Compare in columns */
      .d-cmp-top { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
      .d-cmp-top .d-fig { font-family: var(--font-title); font-size: 1.5rem; font-weight: 600; white-space: nowrap; }
      .d-cmp-top .d-bar { flex: 1; margin: 0; }
      .d-tabs { display: flex; gap: 4px; align-items: flex-end; border-bottom: 1px solid var(--line); }
      .d-tab { padding: .5rem 1.1rem; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; background: color-mix(in srgb, var(--paper-raised) 50%, var(--paper)); font-size: var(--text-sm); display: flex; align-items: center; gap: .4rem; }
      .d-tab.d-on { background: var(--paper-raised); font-weight: 700; padding: .65rem 1.3rem; margin-bottom: -1px; }
      .d-tab i { width: .55rem; height: .55rem; border-radius: 50%; }
      .d-cmp-sheet { background: var(--paper-raised); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; }
      .d-step { display: flex; align-items: center; justify-content: center; gap: 22px; grid-column: 1 / -1; }
      .d-step h2 { font-family: var(--font-title); font-size: 1.5rem; text-align: center; }
      .d-step p { font-family: var(--font-hand); font-size: 1.05rem; color: var(--ink-soft); text-align: center; }
      .d-step i { font-style: normal; font-size: 1.4rem; color: var(--ink-soft); }
      .d-cols { display: grid; grid-template-columns: 7.5rem repeat(3, minmax(0, 1fr)); font-size: var(--text-sm); }
      .d-cols > div { padding: 8px 10px; border-bottom: 1px solid var(--line); }
      .d-cols .d-lab { color: var(--ink-soft); font-size: var(--text-xs); font-weight: 600; padding-left: 0; }
      .d-cols .d-hd { border-bottom: 0; }
      .d-cols .d-hd .d-photo { height: 6rem; margin-bottom: 8px; }
      .d-cols .d-hd b { font-size: var(--text-md); display: flex; align-items: center; gap: .4rem; }
      .d-circle { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-grid; place-items: center; font-size: .7rem; flex: none; }
      .d-circle--on { background: var(--pen); border-color: var(--pen); color: #fff; }
      .d-col-on { background: color-mix(in srgb, var(--pen) 6%, transparent); }
      .d-price { font-family: var(--font-title); font-size: 1.25rem; font-weight: 600; }
      .d-best { color: var(--confirmed); font-size: var(--text-2xs); font-weight: 800; letter-spacing: .06em; display: block; }
      .d-more { color: var(--ink-soft); font-size: var(--text-2xs); font-weight: 700; display: block; }
      .d-yes { color: var(--confirmed); } .d-no { color: var(--ink-soft); }
      .d-stars { color: var(--estimated); letter-spacing: 1px; } .d-stars i { color: var(--line); font-style: normal; }

      /* money screens */
      .d-cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .d-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
      .d-card h3 { font-family: var(--font-title); font-size: 1.2rem; margin-bottom: 8px; }
      .d-row { display: grid; grid-template-columns: .8rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: var(--text-sm); }
      .d-row .d-mini { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--line) 60%, transparent); position: relative; overflow: hidden; margin-top: -3px; }
      .d-row .d-mini i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-soft); }
      .d-cat { width: .6rem; height: .6rem; border-radius: 50%; }
      .d-answer { text-align: center; padding: 22px; }
      .d-answer b { display: block; font-family: var(--font-title); font-size: 2.2rem; margin: 4px 0; }
      .d-settle { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: var(--text-sm); }

      /* your trips */
      .d-shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
      .d-book { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; position: relative; }
      .d-book .d-photo { height: 7.5rem; margin-bottom: 12px; }
      .d-book h3 { font-family: var(--font-title); font-size: 1.25rem; }
      .d-book p { font-size: var(--text-sm); color: var(--ink-soft); margin-top: 2px; }
      .d-book .d-bar { margin: 12px 0 4px; height: 8px; }
      .d-book--new { display: grid; place-items: center; border: 1.5px dashed var(--line); background: none; min-height: 15rem; color: var(--ink-soft); font-size: var(--text-md); }
      .d-tape { position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; transform: translateX(-50%) rotate(-3deg); background: color-mix(in srgb, var(--estimated) 45%, transparent); }

      .d-notes { padding: 40px 60px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
      .d-notes h4 { font-family: var(--font-title); font-size: 1.2rem; margin-bottom: 8px; }
      .d-notes p, .d-notes li { font-size: var(--text-sm); line-height: 1.5; color: var(--ink); }
      .d-notes ul { padding-left: 1.1rem; margin: 0; }
      .d-wire { margin-top: 12px; display: grid; gap: 4px; height: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: var(--paper-raised); }
      .d-wire div { background: color-mix(in srgb, var(--line) 60%, transparent); border-radius: 3px; }

      /* v6b (16 Nov): every card drawn in pencil, no straight edges or shadows; no side bars. */
      .sketch-box.d-place, .sketch-box.d-budget, .sketch-box.d-mapcard, .sketch-box.d-left-list, .sketch-box.d-cmp-sheet,
      .sketch-box.d-card, .sketch-box.d-book, .sketch-box.d-ticket, .sketch-box.d-panel, .sketch-box.d-tab {
        border: 0 !important; box-shadow: none !important; border-radius: 0 !important; }
      .sketch-box.d-ticket, .sketch-box.d-book--new { background: transparent; }
      .sketch-box.d-tab { padding: .5rem 1.1rem; background: color-mix(in srgb, var(--paper-raised) 50%, var(--paper)); }
      .sketch-box.d-tab.d-on { background: var(--paper-raised); padding: .65rem 1.3rem; }
      .d-tabs { border-bottom: 0; gap: 6px; }
      .sketch-box.d-cmp-sheet { margin-top: -2px; }
      .d-hbar { height: 14px; margin: 10px 0 6px; }
      .d-cmp-top .d-hbar { flex: 1; margin: 0; }
      .d-book .d-hbar { margin: 12px 0 4px; height: 10px; }
      .d-nav a.d-on { background: none; box-shadow: none; }
      .d-nav a .u, .d-caps.u { position: relative; display: inline-block; }
      .d-nav a .u { color: var(--ink); white-space: nowrap; }
      .u__line { position: absolute; left: -2px; right: -2px; bottom: -6px; width: calc(100% + 4px); height: 10px; color: var(--estimated); pointer-events: none; }
      .d-grp--on { border-bottom: 1px solid var(--line); }
      .d-ln--open { box-shadow: none; background: color-mix(in srgb, var(--estimated) 12%, transparent); }
      .d-tape--panel { top: -6px; left: 44%; }
      .d-panel { border-left: 0; }
      .sketch-box.d-panel { position: absolute !important; padding: 22px 24px !important; }
      .d-trip-row { display: flex; align-items: flex-start; gap: 8px; padding-right: 14px; }
      .d-trip-row .round-button { width: 2rem; height: 2rem; font-size: .9rem; margin-top: 2px; }
      .d-people { cursor: pointer; }
      .d-people .d-hint { font-family: var(--font-hand); color: var(--ink-soft); font-size: .95rem; margin-left: 6px; align-self: center; }
      .d-actions { display: flex; gap: 8px; align-items: center; }
      .d-address { font-size: var(--text-xs); color: var(--ink-soft); margin: -6px 0 10px; }
      .d-address b { color: var(--ink); font-weight: 600; }
      .d-share h4 { font-family: var(--font-title); font-size: 1.1rem; margin-top: 18px; }
      .d-share p { font-size: var(--text-sm); color: var(--ink-soft); margin-top: 2px; }
      .d-share .d-linkbox { display: flex; gap: 8px; margin-top: 8px; }
      .d-share .d-linkbox span { flex: 1; min-height: 2.5rem; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; background: color-mix(in srgb, var(--line) 45%, var(--paper-raised)); font-size: var(--text-sm); overflow: hidden; white-space: nowrap; }
    
      .phones { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; padding: 10px 0 30px; }
      .phones figure { width: 375px; margin: 0; }
      .phone { width: 375px; height: 760px; overflow: hidden; border-radius: 28px; border: 1px solid #d8ccb4; box-shadow: 0 10px 30px rgb(44 38 32 / .15); background: var(--paper); position: relative; }

      window.addEventListener('load', () => {
        const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#2c2620'
        const m = L.map('h1', { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false })
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 12 }).addTo(m)
        const pts = [[35.68, 139.76], [35.01, 135.77], [26.21, 127.68]]
        L.polyline(pts, { color: ink, weight: 2, dashArray: '7 5' }).addTo(m)
        pts.forEach((p, i) => L.marker(p, { icon: L.divIcon({ className: '', html: `<div class="d-pin d-pin--stay">${i + 1}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(m))
        m.fitBounds(L.latLngBounds(pts), { padding: [24, 24] })
      })
