<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Menus, footer, privacy (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: 0 var(--space-3); }
      .scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 18%, transparent); z-index: 4; }

      /* 1 · the bar at the top of the welcome page */
      .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: color-mix(in srgb, var(--paper) 92%, transparent); border-bottom: 1px solid var(--line); }
      .bar img { width: 26px; height: 26px; }
      .bar__name { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; flex: 1; white-space: nowrap; }
      .pill { display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 .85rem; border-radius: 999px; font-size: var(--text-sm); font-weight: 600; border: 1.5px solid var(--ink); background: var(--paper-raised); white-space: nowrap; }
      .pill--dark { background: var(--ink); color: var(--paper); }
      .burger { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border: 0; background: none; font-size: 1.35rem; color: var(--ink); }
      .scrolled { padding: var(--space-6) var(--space-4); }
      .scrolled h2 { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; }
      .ghost { opacity: .35; }

      /* 2 · the menu, open (phone) */
      .sketch-box.menu-sheet { margin: 0; position: absolute; left: var(--space-3); right: var(--space-3); top: 4.2rem; z-index: 6; padding: var(--space-3) var(--space-4) var(--space-4); }
      .menu-sheet ul { list-style: none; margin: 0; padding: 0; }
      .menu-sheet li a { display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); font-size: var(--text-base); font-weight: 600; }
      .menu-sheet li a small { font-weight: 400; color: var(--ink-soft); font-size: var(--text-sm); }
      .menu-sheet li:last-child a { border-bottom: 0; }
      .menu-acts { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
      .later { font-family: var(--font-hand); font-size: var(--text-note); color: var(--ink-soft); font-weight: 400; }

      /* 3 · computer */
      .wide { width: min(100%, 60rem); }
      .phones figure.wide { width: 56rem; max-width: 100%; }
      .phones figure.wide .phone { width: 100%; max-width: none; }
      .bar--wide { gap: 1.25rem; padding: var(--space-3) var(--space-6); }
      .bar--wide .bar__name { flex: none; }
      .bar__links { display: flex; gap: 1.25rem; flex: 1; justify-content: center; font-size: var(--text-md); font-weight: 600; }
      .bar__links a { color: var(--ink); }
      .bar__acts { display: flex; gap: var(--space-2); align-items: center; }
      .bar__acts a.plain { font-size: var(--text-md); font-weight: 600; margin-right: var(--space-2); }

      /* 4 · footer */
      .foot { margin: var(--space-6) var(--space-4) 0; padding: 1.25rem 0 var(--space-4); border-top: 1px solid var(--line); }
      .foot__brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-title); font-weight: 600; font-size: var(--text-lg); }
      .foot__brand img { width: 24px; }
      .foot__cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-4); }
      .foot__cols p { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin-bottom: var(--space-2); }
      .foot__cols a { display: block; font-size: var(--text-md); padding: .3rem 0; color: var(--ink); }
      .foot__made { margin-top: 1.25rem; font-family: var(--font-hand); font-size: var(--text-note-l); color: var(--ink-soft); }
      .foot__small { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--ink-soft); }

      /* 5 · account menu */
      .app-top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
      .app-top img { width: 28px; }
      .app-top b { font-family: var(--font-title); font-size: var(--text-lg); flex: 1; }
      .me { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: .85rem; font-weight: 600; box-shadow: 0 0 0 2px var(--estimated); }
      .sketch-box.acc { margin: 0; position: absolute; right: var(--space-3); top: 3.9rem; z-index: 6; width: 16.5rem; padding: var(--space-2); }
      .acc__who { padding: var(--space-2) var(--space-3) var(--space-3); border-bottom: 1px solid var(--line); }
      .acc__who b { display: block; }
      .acc__who span { font-size: var(--text-sm); color: var(--ink-soft); }
      .acc a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-3); font-size: var(--text-md); color: var(--ink); }
      .acc a i { width: 1.2rem; text-align: center; font-style: normal; color: var(--ink-soft); }
      .acc hr { border: 0; border-top: 1px solid var(--line); margin: var(--space-1) 0; }
      .acc .quiet { color: var(--ink-soft); }

      /* 6 · privacy */
      .doc { padding: var(--space-4); }
      .doc h1 { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; }
      .doc .lede { color: var(--ink-soft); margin-top: var(--space-1); font-size: var(--text-md); }
      .sketch-box.doc-sheet { margin-top: var(--space-4); padding: 1.25rem var(--space-4) var(--space-4); }
      .doc h3 { font-family: var(--font-title); font-size: var(--text-base); font-weight: 600; margin-top: var(--space-3); }
      .doc h3:first-of-type { margin-top: 0; }
      .doc p, .doc li { font-size: var(--text-sm); line-height: 1.5; }
      .doc ul { margin: var(--space-1) 0 0 1.1rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. The bar at the top of the welcome page -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="bar">
            <img src="/illustrations/compass.svg" alt="" />
            <span class="bar__name">Voyage Fare</span>
            <a class="pill">Try the demo</a>
            <button class="burger" aria-label="Menu">☰</button>
          </div>
          <div class="scrolled ghost">
            <h2>How it works</h2>
            <p style="margin-top:var(--space-2)">1 · Add your places and what you’re thinking of…</p>
            <p style="margin-top:var(--space-2)">2 · Compare the options, pick your coup de cœur…</p>
            <p style="margin-top:var(--space-2)">3 · Everyone sees their own share…</p>
          </div>
        </div>
        <figcaption><b>1 · A bar at the top of the welcome page.</b> It stays there while you scroll.
          <ul>
            <li>The compass + Voyage Fare: back to the top.</li>
            <li><b>Try the demo</b>, always one tap away (what we most want a visitor to do).</li>
            <li><b>☰</b> opens the menu (2). “Sign in” moves into it, to keep the bar light.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. The menu, open -->
      <figure>
        <div class="phone" style="min-height:36rem;padding-bottom:0">
          <div class="bar">
            <img src="/illustrations/compass.svg" alt="" />
            <span class="bar__name">Voyage Fare</span>
            <a class="pill">Try the demo</a>
            <button class="burger" aria-label="Close">✕</button>
          </div>
          <div class="scrim"></div>
          <div class="sketch-box sketch-box--strong menu-sheet" data-seed="31">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <ul>
              <li><a>How it works <small>›</small></a></li>
              <li><a>See a real trip <small>the demo, no sign-up</small></a></li>
              <li><a>The story behind it <span class="later">soon</span></a></li>
              <li><a>Contact <small>hello@voyagefare.app</small></a></li>
            </ul>
            <div class="menu-acts">
              <a class="button button--primary button--wide">Create my notebook</a>
              <a class="button button--quiet button--wide">Sign in</a>
            </div>
          </div>
        </div>
        <figcaption><b>2 · The menu, open (phone).</b> A sheet of the notebook drops under the bar.
          <ul>
            <li>How it works · See a real trip · The story behind it (once the case study is written) · Contact.</li>
            <li>At the bottom, the two ways in: <b>Create my notebook</b> and <b>Sign in</b>.</li>
            <li>Already signed in: one button, <b>Your trips ›</b>, instead of the two.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. Footer -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="ghost pad" style="text-align:center;padding-top:var(--space-6)">
            <a class="button button--primary">Try it with a real trip</a>
          </div>
          <footer class="foot">
            <span class="foot__brand"><img src="/illustrations/compass.svg" alt="" />Voyage Fare</span>
            <div class="foot__cols">
              <div>
                <p>The app</p>
                <a>How it works</a>
                <a>See a real trip</a>
                <a>Create my notebook</a>
                <a>Sign in</a>
              </div>
              <div>
                <p>About</p>
                <a>The story behind it</a>
                <a>Contact</a>
                <a>Privacy</a>
              </div>
            </div>
            <p class="foot__made">Made by Djamina, for trips with her sisters.</p>
            <p class="foot__small">© 2026 Voyage Fare · Made in Saint-Martin</p>
          </footer>
        </div>
        <figcaption><b>3 · A real footer</b> at the end of the welcome page (today: one line).
          <ul>
            <li><b>The app:</b> How it works · See a real trip · Create my notebook · Sign in.</li>
            <li><b>About:</b> The story behind it · Contact · <b>Privacy</b> (5).</li>
            <li>Your line, handwritten, then © 2026. “Made in Saint-Martin”: yours to keep or drop.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 5. Account menu -->
      <figure>
        <div class="phone" style="min-height:36rem;padding-bottom:0">
          <div class="app-top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><span class="me">D</span></div>
          <div class="pad ghost" style="padding-top:var(--space-4)"><h1 style="font-family:var(--font-title);font-size:var(--text-2xl)">Your trips</h1></div>
          <div class="scrim" style="top:3.6rem"></div>
          <div class="sketch-box sketch-box--strong acc" data-seed="33">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <div class="acc__who"><b>Djamina</b><span>djamina@…</span></div>
            <a><i>▤</i>Your trips</a>
            <a><i>◎</i>See the demo</a>
            <a><i>✎</i>Send feedback</a>
            <a><i>⬇</i>Put it on my phone</a>
            <hr />
            <a><i>⚙</i>Account</a>
            <a><i>§</i>Privacy</a>
            <a class="quiet"><i>↩</i>Sign out</a>
          </div>
        </div>
        <figcaption><b>4 · The account menu</b> (your initial, top right, inside the app). Today: Account · Sign out.
          <ul>
            <li>Added: <b>Your trips</b> (from anywhere), <b>See the demo</b>, <b>Send feedback</b> (for testers: opens a short note to us, with the page they were on), <b>Put it on my phone</b> (only if it isn’t yet), <b>Privacy</b>.</li>
            <li>The icons here are placeholders: the drawn icons come in build 8.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 6. Privacy -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="app-top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><a class="pill">Try the demo</a></div>
          <div class="doc">
            <h1>Privacy</h1>
            <p class="lede">In plain words. Last changed 15 Nov 2026.</p>
            <div class="sketch-box sketch-box--light doc-sheet" data-seed="35">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <h3>What we keep</h3>
              <ul><li>Your email, first name and password (scrambled, we can’t read it).</li><li>Your trips: places, prices, who paid what, and the names you give your travellers.</li></ul>
              <h3>Why</h3>
              <p>Only to run your notebook. No ads, nothing sold, no tracking.</p>
              <h3>Who helps us</h3>
              <ul><li>Supabase (the database, in Paris) · Vercel (the website) · Resend (our emails) · Cloudflare (the “not a robot” check).</li></ul>
              <h3>Your choices</h3>
              <ul><li>Delete your account any time in Account: everything goes with it.</li><li>A question? hello@voyagefare.app</li></ul>
            </div>
          </div>
        </div>
        <figcaption><b>5 · A Privacy page</b> (needed: we keep the emails of people in Europe, so GDPR applies). Short, plain, one sheet: what we keep, why, who helps us, how to delete everything. Who’s responsible (your name or a company) to decide before testers.</figcaption>
      </figure>

    </div>

    <!-- 3. On a computer -->
    <div class="phones" style="justify-content:center">
      <figure class="wide">
        <div class="phone" style="padding-bottom:0">
          <div class="bar bar--wide">
            <img src="/illustrations/compass.svg" alt="" />
            <span class="bar__name">Voyage Fare</span>
            <nav class="bar__links"><a>How it works</a><a>See a real trip</a><a>The story</a></nav>
            <span class="bar__acts"><a class="plain">Sign in</a><a class="pill pill--dark">Create my notebook</a></span>
          </div>
          <div class="ghost" style="text-align:center;padding:var(--space-8) var(--space-4)">
            <h2 style="font-family:var(--font-title);font-size:2.2rem">Plan the trip together, and know what it really costs you.</h2>
          </div>
        </div>
        <figcaption style="max-width:40rem"><b>6 · On a computer</b>, no ☰: the links sit in the bar. How it works · See a real trip · The story, then Sign in and <b>Create my notebook</b>.</figcaption>
      </figure>
    </div>

    <script>
      const only = new URLSearchParams(location.search).get('only')
      if (only) document.querySelectorAll('.phones > figure').forEach((f, i) => { if (!only.split(',').includes(String(i + 1))) f.remove() })
    </script>
  </body>
</html>
