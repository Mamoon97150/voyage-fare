<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Read-only share link (build 8 step 6, v5 look, 16 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: var(--space-4); }
      .ghost { opacity: .35; }
      .kicker { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .sheet { padding: var(--space-6) var(--space-4) var(--space-4); margin: var(--space-3); }
      .sheet h3 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .lead { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.45; margin-top: var(--space-1); }
      .linkbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; margin-top: var(--space-3); padding: var(--space-2) var(--space-3); border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper-raised); }
      .linkbox b { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill-btn { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.2rem; padding: 0 .8rem; border: 1.5px solid var(--ink); border-radius: 999px; font-size: var(--text-xs); font-weight: 600; background: var(--paper-raised); color: var(--ink); white-space: nowrap; }
      .row-opt { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
      .row-opt small { display: block; color: var(--ink-soft); font-size: var(--text-xs); }
      .tgl { flex: none; width: 2.6rem; height: 1.5rem; border-radius: 999px; background: var(--line); position: relative; }
      .tgl::after { content: ''; position: absolute; top: 3px; left: 3px; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--paper-raised); box-shadow: var(--shadow-1); }
      .tgl--on { background: var(--confirmed); }
      .tgl--on::after { left: auto; right: 3px; }
      .never { margin-top: var(--space-3); font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.5; }
      .never b { color: var(--ink); }
      .acts { display: flex; gap: var(--space-2); justify-content: space-between; align-items: center; margin-top: var(--space-4); }
      .off { color: var(--ink-soft); font-size: var(--text-sm); text-decoration: underline; }

      .menu { list-style: none; margin: 0; padding: 0; }
      .menu li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); }
      .menu li .ic { width: 1.6rem; text-align: center; }
      .menu li small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .menu li.new { font-weight: 600; }

      /* the visitor's view */
      .strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; margin: var(--space-3); padding: var(--space-2) var(--space-3); background: var(--paper-note); border: 1.5px dashed var(--ink-soft); border-radius: 10px; font-size: var(--text-sm); line-height: 1.4; }
      .strip b.k { display: block; font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
      .top { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-2); }
      .top h1 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; line-height: 1.15; }
      .top .sub { font-family: var(--font-hand); font-size: var(--text-note-l); color: var(--ink-soft); }
      .grow { flex: 1; min-width: 0; }
      .initials { display: flex; }
      .initials span { width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 700; background: var(--line); margin-left: -.35rem; border: 2px solid var(--paper); }
      .big { padding: 0 var(--space-4); display: flex; justify-content: space-between; align-items: baseline; }
      .big b { font-family: var(--font-title); font-size: var(--text-2xl); }
      .big small { color: var(--ink-soft); font-size: var(--text-sm); }
      .place { margin: var(--space-3) var(--space-4) 0; padding: var(--space-3); border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
      .place h4 { font-family: var(--font-title); font-size: var(--text-lg); display: flex; justify-content: space-between; align-items: baseline; }
      .place h4 small { font-size: var(--text-xs); color: var(--ink-soft); font-family: inherit; }
      .line { display: grid; grid-template-columns: 1fr auto; padding: var(--space-2) 0; border-top: 1px solid var(--line); font-size: var(--text-sm); }
      .line .w { display: block; font-size: var(--text-2xs); color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
      .line .p { font-weight: 600; }
      .tabs { display: flex; justify-content: space-around; margin-top: var(--space-4); padding: var(--space-2) 0; border-top: 1px solid var(--line); font-size: var(--text-xs); color: var(--ink-soft); }
      .tabs b { color: var(--ink); }
      .center { text-align: center; padding: var(--space-8, 3rem) var(--space-4); }
      .center h2 { font-family: var(--font-title); font-size: var(--text-xl); margin-top: var(--space-2); }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Where it starts -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="ghost pad"><p class="kicker">Japan in spring</p><p style="font-family:var(--font-title);font-size:var(--text-xl)">2 – 12 Apr 2027</p></div>
          <div class="sketch-box sketch-box--strong sheet" data-seed="91">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <ul class="menu">
              <li><span class="ic">✉</span><span>Forward a booking</span></li>
              <li><span class="ic">📋</span><span>Paste a booking email</span></li>
              <li><span class="ic">✦</span><span>Copy the trip for my AI</span></li>
              <li class="new"><span class="ic">↗</span><span>Share a read-only link<small>show the trip without inviting anyone</small></span></li>
              <li><span class="ic">⇣</span><span>Import from my AI</span></li>
              <li><span class="ic">⧉</span><span>Start a new trip from this one</span></li>
              <li><span class="ic">⚙</span><span>Trip settings</span></li>
            </ul>
          </div>
        </div>
        <figcaption><b>1 · In the trip menu.</b> “Share a read-only link”: for a friend, your parents, someone who gave tips… They see the trip; they can’t change anything, and they don’t need an account.
          <ul><li>Different from <b>Invite</b> (a traveller, who shares the costs and can edit).</li></ul>
        </figcaption>
      </figure>

      <!-- 2. The link -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="sketch-box sketch-box--strong sheet" data-seed="92">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h3>Share a read-only link</h3>
            <p class="lead">Anyone with the link sees the trip. They can’t change anything.</p>
            <div class="linkbox"><b>voyagefare.app/s/k7Q2mX9pLw</b><span class="pill-btn">Copy</span></div>
            <a class="button button--primary button--wide" style="margin-top:var(--space-3)">↗ Send it…</a>
            <p class="kicker" style="margin-top:var(--space-4)">What they see</p>
            <div class="row-opt"><span>Prices and the budget<small>off: just the route, places, days and ideas</small></span><span class="tgl tgl--on" aria-hidden="true"></span></div>
            <div class="row-opt"><span>Travellers’ names<small>off: “Traveller 1”, “Traveller 2”</small></span><span class="tgl" aria-hidden="true"></span></div>
            <p class="never">Never in the link: <b>who paid what</b> and the balances, <b>booking numbers and files</b>, the trip’s email address, notes on payments.</p>
            <div class="acts"><a class="off">Turn the link off</a><a class="button button--quiet">Done</a></div>
          </div>
        </div>
        <figcaption><b>2 · The link.</b> Made the first time you open this; then the same link.
          <ul>
            <li><b>Copy</b>, or <b>Send it…</b> (the phone’s share sheet: WhatsApp, Messages…).</li>
            <li>Two choices: <b>prices</b> (on by default) and <b>names</b> (off by default: Traveller 1, 2).</li>
            <li>Some things are <b>never</b> in it, said plainly.</li>
            <li><b>Turn the link off</b>: it stops working at once. Making it again gives a new link (the old one stays dead).</li>
            <li>Any traveller of the trip can make it, change what it shows, or turn it off.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 3. What they see -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <aside class="strip"><span><b class="k">Shared with you · read-only</b>A trip planned on Voyage Fare.</span><a class="pill-btn">Plan mine ›</a></aside>
          <div class="top"><div class="grow"><h1>Japan in spring</h1><p class="sub">2 – 12 Apr 2027 · 2 travellers</p></div><div class="initials"><span>T1</span><span>T2</span></div></div>
          <div class="big"><b>≈ 1 240 €</b><small>each, estimated</small></div>
          <div class="place"><h4>1. Tokyo <small>4 nights</small></h4>
            <div class="line"><span><span class="w">Stay</span>Hotel Gracery Shinjuku</span><span class="p">640 €</span></div>
            <div class="line"><span><span class="w">Day 2 · Sat 3 Apr</span>teamLab Planets</span><span class="p">30 €</span></div>
            <div class="line"><span><span class="w">Day 3</span>Day in Nikko</span><span class="p" style="color:var(--ink-soft)">—</span></div>
          </div>
          <div class="place"><h4>2. Kyoto <small>3 nights</small></h4>
            <div class="line"><span><span class="w">Stay</span>Ryokan or hotel? <span style="color:var(--ink-soft)">· 2 to compare</span></span><span class="p">from 450 €</span></div>
          </div>
          <div class="tabs"><b>Trip</b><span>Route</span><span>Compare</span><span>Budget</span></div>
        </div>
        <figcaption><b>3 · What they see.</b> The trip as the demo shows it, read-only, with a note at the top.
          <ul>
            <li>Trip, Route (the map), Compare, Budget. No Who paid.</li>
            <li>Names hidden: <b>T1, T2</b>; prices off: the lines without amounts and no Budget tab.</li>
            <li>“Plan mine ›” goes to the welcome page. Nothing asks them to sign in.</li>
            <li>Always up to date: it’s the trip as it is now, not a copy.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. Link off -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="center">
            <p class="hand" style="font-size:var(--text-note-l)">this page is closed</p>
            <h2>This link doesn’t work any more</h2>
            <p class="lead" style="margin-top:var(--space-2)">The person who shared it turned it off. Ask them for a new one.</p>
            <a class="button button--quiet" style="margin-top:var(--space-4)">What’s Voyage Fare?</a>
          </div>
        </div>
        <figcaption><b>4 · A link turned off</b> (or one that never existed): one plain page, the same in both cases, so nobody can guess links. Nothing about the trip.</figcaption>
      </figure>

    </div>
  </body>
</html>
