<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Duplicate a trip (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 18%, transparent); z-index: 4; }
      .top { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-6) var(--space-4) var(--space-2); }
      .top .back { font-size: 1.6rem; color: var(--ink); }
      .top h1 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; line-height: 1.15; }
      .top .sub { font-family: var(--font-hand); font-size: var(--text-note-l); color: var(--ink-soft); }
      .grow { flex: 1; min-width: 0; }
      .ghost { opacity: .35; padding: var(--space-4); }
      .ghost .card { height: 6rem; border: 1px solid var(--line); border-radius: 10px; margin-top: var(--space-3); }
      .sketch-box.sheet-up { margin: 0; position: absolute; left: var(--space-2); right: var(--space-2); bottom: var(--space-2); z-index: 6; padding: var(--space-6) var(--space-4) var(--space-4); }
      .sheet-up h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; }
      .lead { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.45; margin-top: var(--space-1); }
      .label { margin-top: var(--space-3); font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
      .chips .chip { min-height: 2.1rem; font-size: .8125rem; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); margin-top: var(--space-2); }
      .switch-row small { display: block; color: var(--ink-soft); font-size: var(--text-xs); }
      .sw { width: 2.6rem; height: 1.5rem; border-radius: 999px; background: var(--line); position: relative; flex: none; }
      .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--paper-raised); box-shadow: var(--shadow-1); }
      .sw--on { background: var(--confirmed); } .sw--on::after { left: auto; right: 3px; }
      .keeps { margin-top: var(--space-3); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1) var(--space-3); font-size: var(--text-xs); color: var(--ink-soft); }
      .keeps b { color: var(--ink); display: block; font-size: var(--text-2xs); letter-spacing: .06em; text-transform: uppercase; }
      .acts { margin-top: var(--space-4); display: grid; gap: var(--space-2); }
      .sketch-box.trip-menu { margin: 0; position: absolute; right: var(--space-3); top: 4.6rem; z-index: 6; width: 17.5rem; padding: var(--space-2); }
      .trip-menu a { display: flex; align-items: center; gap: var(--space-3); min-height: 46px; padding: 0 var(--space-3); font-size: var(--text-md); color: var(--ink); }
      .trip-menu a i { width: 1.2rem; text-align: center; font-style: normal; color: var(--ink-soft); }
      .trip-menu hr { border: 0; border-top: 1px solid var(--line); margin: var(--space-1) 0; }
      .dots { width: 2.25rem; height: 2.25rem; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--ink); background: var(--paper-raised); font-weight: 700; box-shadow: 0 0 0 3px var(--estimated); }
      .note { margin: var(--space-3) var(--space-4) 0; }
    </style>
  </head>
  <body>
    <div class="phones">

      <figure>
        <div class="phone" style="min-height:36rem;padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Colombia &amp; Panama</h1><p class="sub">Sept 2026 · 14 nights</p></div><span class="dots">⋯</span></div>
          <div class="ghost"><div class="card"></div><div class="card"></div></div>
          <div class="scrim" style="top:4.4rem"></div>
          <div class="sketch-box sketch-box--strong trip-menu" data-seed="41">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <a><i>✦</i>Copy the trip for my AI</a>
            <a><i>⇣</i>Import from my AI</a>
            <a style="font-weight:600"><i>⧉</i>Start a new trip from this one</a>
            <hr />
            <a><i>⚙</i>Trip settings</a>
          </div>
        </div>
        <figcaption><b>1 · In the trip menu:</b> <b>Start a new trip from this one</b>. The words say what it’s for: going back somewhere, or reusing last year’s plan, not a second copy to keep.</figcaption>
      </figure>

      <figure>
        <div class="phone" style="min-height:40rem;padding-bottom:0">
          <div class="top ghost" style="padding:var(--space-6) var(--space-4) var(--space-2)"><a class="back">‹</a><div class="grow"><h1>Colombia &amp; Panama</h1></div></div>
          <div class="scrim"></div>
          <div class="sketch-box sketch-box--strong sheet-up" data-seed="61">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h2>A new trip from this one</h2>
            <p class="lead">Same places and lines, ready to plan again. Nothing changes in Colombia &amp; Panama.</p>
            <p class="label">Name</p>
            <div class="field__input" style="margin-top:var(--space-1);display:flex;align-items:center">Colombia &amp; Panama again</div>
            <p class="label">Who comes</p>
            <div class="chips">
              <button class="chip" aria-pressed="true">Ana · you</button>
              <button class="chip" aria-pressed="true">Bea</button>
              <button class="chip" aria-pressed="false">Cleo</button>
              <button class="chip" aria-pressed="true">Eva</button>
            </div>
            <div class="switch-row"><span>The options you compared<small>off: only what you chose</small></span><span class="sw sw--on"></span></div>
            <div class="keeps">
              <span><b>Comes along</b>places, nights, the route, lines and their days, prices, notes, links, To try, daily estimates, rooms</span>
              <span><b>Starts fresh</b>dates, bookings and payments (all back to estimated), who paid, the invitations</span>
            </div>
            <div class="acts"><a class="button button--primary button--wide">Start the new trip</a></div>
          </div>
        </div>
        <figcaption><b>2 · The sheet.</b>
          <ul>
            <li><b>Name</b>: “… again” to start with, change it here.</li>
            <li><b>Who comes</b>: you always; tap the others (they’re asked again: the invitations don’t carry over).</li>
            <li><b>The options you compared</b> (on): keep the alternatives; off keeps only what was chosen.</li>
            <li>What comes along and what starts fresh, said plainly: no dates, nothing booked or paid, prices back to <b>estimated</b>.</li>
          </ul>
        </figcaption>
      </figure>

      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Colombia &amp; Panama again</h1><p class="sub">dates not decided · 3 travellers</p></div><span class="dots" style="box-shadow:none">⋯</span></div>
          <p class="form-message form-message--info note" role="status">A new trip from Colombia &amp; Panama: 5 places, 48 lines, all estimated. Add the dates when you know them.</p>
          <div class="ghost"><div class="card"></div><div class="card"></div></div>
        </div>
        <figcaption><b>3 · The new trip opens</b>, with a note saying where it came from and what to do next (the dates).</figcaption>
      </figure>

    </div>
  </body>
</html>
