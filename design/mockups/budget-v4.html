<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Budget (v4 look, cards)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v4.js'
    </script>
  </head>
  <body>
    <div class="phones">
      <figure>
        <div class="phone">
          <div class="screen screen--trip">
            <header class="screen__top"><span class="screen__back">‹</span><div class="screen__heading"><h1 class="screen__title screen__title--trip">Colombia &amp; Panama</h1><p class="screen__sub">4 – 18 Sept 2026 · 4 travellers</p></div><span class="avatars"><span class="avatar avatar--me">D</span><span class="avatar">P</span><span class="avatar">D</span><span class="avatar">G</span></span></header>
            <section class="trip-budget"><div class="trip-budget__row"><p class="trip-budget__figure num">2 912 €</p><div class="words-switch"><button><span class="u">your share</span></button><span> · </span><button>total</button></div></div><div class="hand-bar" data-confirmed="0.902" data-estimated="0.098" style="height:16px;margin-top:var(--space-2)"><svg></svg></div><div class="trip-budget__legend num"><span><b class="trip-budget__confirmed-figure">2 627 €</b> confirmed</span><span><b class="trip-budget__estimated-figure">285 €</b> still estimated</span></div></section>
            <div class="cards">
              <section class="sketch-box sketch-box--light card " data-seed="71">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>By category<small>your share</small></h2><b>2 912 €</b></header>
<div class="line"><span><span class="line__name">The package</span><span class="line__meta">flights, hotels, transfers</span><div class="hand-bar hand-bar--mini" data-confirmed="1" data-estimated="0"><svg></svg></div></span><span class="line__amount">2 560 €<span class="line__tag line__tag--ok">● Paid</span></span></div>
<div class="line"><span><span class="line__name">Activities</span><span class="line__meta">67 € confirmed · 255 € estimated</span><div class="hand-bar hand-bar--mini" data-confirmed="0.026171875" data-estimated="0.099609375"><svg></svg></div></span><span class="line__amount">322 €</span></div>
<div class="line"><span><span class="line__name">Getting around</span><span class="line__meta">18 € estimated</span><div class="hand-bar hand-bar--mini" data-confirmed="0" data-estimated="0.00703125"><svg></svg></div></span><span class="line__amount">18 €</span></div>
<div class="line"><span><span class="line__name">Food</span><span class="line__meta">12 € estimated · 9 meals have no price</span><div class="hand-bar hand-bar--mini" data-confirmed="0" data-estimated="0.0046875"><svg></svg></div></span><span class="line__amount">12 €</span></div>
<div class="line"><span><span class="line__name">Travel</span><span class="line__meta">the 5 flights · in the package</span></span><span class="line__amount">Included</span></div>
<div class="line"><span><span class="line__name">Stay</span><span class="line__meta">5 hotels · in the package</span></span><span class="line__amount">Included</span></div>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="72">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>By place<small>your share</small></h2><b>352 €</b></header>
<div class="line"><span><span class="line__name">Bogotá</span><span class="line__meta">2 nights · estimated</span></span><span class="line__amount">25 €</span></div>
<div class="line"><span><span class="line__name">Guatapé</span><span class="line__meta">2 nights · estimated</span></span><span class="line__amount">84 €</span></div>
<div class="line"><span><span class="line__name">Medellín</span><span class="line__meta">4 nights · estimated</span></span><span class="line__amount">67 €</span></div>
<div class="line"><span><span class="line__name">Cartagena</span><span class="line__meta">5 nights · 67 € confirmed · 104 € estimated</span></span><span class="line__amount">171 €</span></div>
<div class="line"><span><span class="line__name">Panama City</span><span class="line__meta">1 night · estimated</span></span><span class="line__amount">5 €</span></div>
<p class="card__note">+ 2 560 € not tied to a place: the package</p>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="73">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Everyone’s share<small>the whole trip</small></h2><b>11 474 €</b></header>
<div class="line line--who"><span class="avatar avatar--me">D</span><span><span class="line__name">Djamina</span><span class="line__meta">you · the jet-ski is yours</span></span><span class="line__amount">2 912 €</span></div>
<div class="line line--who"><span class="avatar">D</span><span><span class="line__name">Danielle</span></span><span class="line__amount">2 877 €</span></div>
<div class="line line--who"><span class="avatar">G</span><span><span class="line__name">Gabriel</span></span><span class="line__amount">2 877 €</span></div>
<div class="line line--who"><span class="avatar">P</span><span><span class="line__name">Peggy</span><span class="line__meta">the photoshoot is a gift to her</span></span><span class="line__amount">2 810 €</span></div>
              </section>
              <section class="sketch-box sketch-box--light card card--plain" data-seed="74" data-dashed="1">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Not counted yet<small>12 without a price</small></h2></header>
<p class="card__note">Chorro de Quevedo, Andrés DC, OCI.mde, Hato Viejo, La 70, RITWAL, Spa Bonanova, the airport taxi, La Cevichería, Nía Bakery, Morena Orígenes, the farewell dinner</p>
<p style="margin-top: var(--space-2)"><span class="quiet-link">Price them in Compare ›</span></p>
              </section>
            </div>
            <nav class="trip-nav"><a><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"></path></svg>Trip</a><a><svg viewBox="0 0 24 24"><rect x="4" y="5" width="6" height="14" rx="1.5"></rect><rect x="14" y="5" width="6" height="14" rx="1.5"></rect></svg>Compare</a><a class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v8l6 5"></path></svg>Budget</a><a><svg viewBox="0 0 24 24"><path d="M4 9h14l-3-3M20 15H6l3 3"></path></svg>Who paid</a></nav>
          </div>
        </div>
        <figcaption><b>Budget · one card per section</b>, like the places on the trip page: each with its title and its total in the head. “Not counted yet” is dashed, like the whole-trip sheet: it isn’t money yet. The package counts as one line (your answer).</figcaption>
      </figure>
    </div>
  </body>
</html>
