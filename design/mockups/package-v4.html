<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Agency packages (v4 look)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v4.js'
    </script>
    <style>
      .phone { padding: var(--space-3) var(--space-3) var(--space-6); }
      .stack { display: flex; flex-direction: column; gap: var(--space-4); }
      .pin-n { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--confirmed); color: var(--paper); font: 600 0.75rem var(--font-text); margin-right: 0.45rem; vertical-align: 0.15em; }
      .line .line__amount .line__tag.pkg-tag { color: var(--chosen); }
      .in-pkg .line__amount { color: var(--chosen) !important; }
      .covers { font-family: var(--font-hand); font-size: 1.1rem; color: var(--ink-soft); line-height: 1.2; display: block; margin-top: 0.15rem; }
      .in-pkg .line__amount { font-weight: 500; color: var(--ink-soft); font-size: 0.875rem; }
      .head-plus { display: block; font-family: var(--font-hand); font-size: 1rem; color: var(--ink-soft); font-weight: 400; text-align: right; }
      .chip-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-2); margin: var(--space-1) 0 var(--space-3); }
      .chip-grid .chip { grid-column: span 3; min-height: 2.25rem; font-size: 0.75rem; padding: 0 0.3rem; white-space: nowrap; }
      .chip-grid .chip:nth-child(-n+3) { grid-column: span 2; }
      .field { margin-bottom: var(--space-3); }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
      .checklist { list-style: none; padding: 0; margin: var(--space-1) 0 0; }
      .checklist li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: var(--space-2); align-items: start; padding: 0.4rem 0; border-top: 1px solid var(--line); font-size: 0.875rem; }
      .checklist li:first-child { border-top: 0; }
      .checklist .box { width: 1.1rem; height: 1.1rem; border: 1.5px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 0.75rem; margin-top: 0.1rem; }
      .checklist .box--on { border-color: var(--chosen); color: var(--chosen); font-weight: 700; }
      .checklist small { display: block; color: var(--ink-soft); font-size: 0.75rem; }
      .checklist .where { font-size: 0.6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); border-top: 0; padding: var(--space-2) 0 0; display: block; }
      .hand { font-family: var(--font-hand); font-size: 1.1rem; color: var(--ink-soft); line-height: 1.2; }
      .adds span { font-size: 0.875rem; font-weight: 600; color: var(--confirmed); }
      .q { margin-top: var(--space-3); font-size: 0.8125rem; line-height: 1.45; }
      .q b { display: block; font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.2rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. On the trip page -->
      <figure>
        <div class="phone stack">
          <div class="sketch-box sketch-box--light card" data-seed="61">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="card__head"><h2><span class="pin-n">1</span>Bogotá<small>2 nights</small></h2><b class="num">119 €<span class="head-plus">+ package</span></b></header>
            <div class="line in-pkg"><span><span class="line__name">Grand Hyatt Bogotá</span><span class="line__meta">Stay · days 1–3</span></span><span class="line__amount">in the<span class="line__tag pkg-tag">Package</span></span></div>
            <div class="line"><span><span class="line__name">Andrés DC</span><span class="line__meta">Food · day 2</span></span><span class="line__amount">45 €<span class="line__tag line__tag--ok">Paid</span></span></div>
            <div class="line"><span><span class="line__name">Monserrate cable car</span><span class="line__meta">Activities · day 2</span></span><span class="line__amount">7 €<span class="line__tag line__tag--owe">Estimated</span></span></div>
          </div>
          <div class="sketch-box sketch-box--light card" data-seed="62" data-dashed="1">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="card__head"><h2>Whole trip<small>tickets, insurance, car…</small></h2></header>
            <div class="line"><span><span class="line__name">Frégate Agency package</span><span class="line__meta">Package · each paid their own share</span><span class="covers">covers 6 flights · 5 stays · most transfers</span></span><span class="line__amount">2 560 €<span class="line__tag line__tag--ok">Paid</span></span></div>
            <div class="line"><span><span class="line__name">Travel insurance</span><span class="line__meta">Insurance</span></span><span class="line__amount">—<span class="line__tag">Idea</span></span></div>
          </div>
        </div>
        <figcaption><b>1 · On the trip page.</b> The package is one line on the whole-trip sheet, with what it covers in handwriting. A covered line has no price to type: it says <b>in the package</b> (blue, like the package it belongs to) and counts as booked. A place with covered lines shows <i>+ package</i> under its total.</figcaption>
      </figure>

      <!-- 2. Adding / changing a package -->
      <figure>
        <div class="phone">
          <div class="sketch-box sketch-box--strong card" data-seed="63">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <header class="card__head"><h2>Add to the whole trip</h2></header>
            <span class="field__label">What is it?</span>
            <div class="chip-grid"><button class="chip" aria-pressed="false">Travel</button><button class="chip" aria-pressed="false">Getting around</button><button class="chip" aria-pressed="false">Insurance</button><button class="chip" aria-pressed="true">Package</button><button class="chip" aria-pressed="false">Other</button></div>
            <div class="field"><label class="field__label">Name</label><input class="field__input" value="Frégate Agency package" /></div>
            <div class="row2"><div class="field"><label class="field__label">Price</label><div class="field__box"><input class="field__input num" value="10 240" /><span class="field__unit">EUR</span></div></div><div class="field"><label class="field__label">Is for</label><input class="field__input" value="Everyone (4)" /></div></div>
            <span class="field__label">What it covers</span>
            <ul class="checklist">
              <li class="where"><span class="where">Getting there and back</span></li>
              <li><span class="box box--on">✓</span><span>St Martin → Bogotá <small>Plane · via Panama</small></span></li>
              <li><span class="box box--on">✓</span><span>Panama City → St Martin <small>Plane</small></span></li>
              <li class="where"><span class="where">1 · Bogotá</span></li>
              <li><span class="box box--on">✓</span><span>Grand Hyatt Bogotá <small>Stay</small></span></li>
              <li><span class="box">&nbsp;</span><span>Andrés DC <small>Food</small></span></li>
              <li class="where"><span class="where">2 · Guatapé …</span></li>
            </ul>
            <p class="hand" style="margin: var(--space-2) 0">tick what’s in it: those lines won’t need a price</p>
            <div class="adds"><span>+ Something else it covers</span></div>
            <div class="add-item__actions" style="margin-top: var(--space-3)"><button class="button button--quiet">Cancel</button><button class="button button--primary">Add</button></div>
          </div>
        </div>
        <figcaption><b>2 · Adding a package.</b> “Package” joins the whole-trip choices (3-2). Name, price, who it’s for, then <b>what it covers</b>: tick the lines already in the trip (grouped by place), or add one it covers (a hotel you haven’t written down yet). Paid in parts (you paid yours in 2): that’s “what’s left to pay”, next.</figcaption>
      </figure>

      <!-- 3. In the budget -->
      <figure>
        <div class="phone stack">
          <div class="sketch-box sketch-box--light card" data-seed="64">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="card__head"><h2>By category<small>your share</small></h2></header>
            <div class="line"><span><span class="line__name">Package</span><span class="line__meta">covers Travel · Stay · Getting around</span></span><span class="line__amount">2 560 €</span></div>
            <div class="line"><span><span class="line__name">Food</span><span class="line__meta">412 € confirmed · 60 € estimated</span></span><span class="line__amount">472 €</span></div>
            <div class="line"><span><span class="line__name">Activities</span></span><span class="line__amount">318 €</span></div>
            <div class="line"><span><span class="line__name">Travel</span></span><span class="line__amount" style="font-weight:500;color:var(--ink-soft)">in the package</span></div>
            <div class="line"><span><span class="line__name">Stay</span></span><span class="line__amount" style="font-weight:500;color:var(--ink-soft)">in the package</span></div>
          </div>
          <div class="sketch-box sketch-box--light card" data-seed="65">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="card__head"><h2>By place<small>your share</small></h2></header>
            <div class="line"><span><span class="line__name">Bogotá</span><span class="line__meta">+ the hotel, in the package</span></span><span class="line__amount">119 €</span></div>
            <div class="line"><span><span class="line__name">Cartagena</span><span class="line__meta">+ the hotel, in the package</span></span><span class="line__amount">471 €</span></div>
            <p class="card__note">+ 2 560 € package, for the whole trip</p>
          </div>
          <p class="q"><b>Not in V1 (maybe later)</b>Splitting the package’s price over its hotels and flights yourself, for an exact “by place”. Agencies rarely give that breakdown, so by default nothing is made up.</p>
        </div>
        <figcaption><b>3 · In the budget.</b> The package is its own category, saying what it covers; Travel and Stay say <i>in the package</i> instead of a misleading 0 €. By place: the place’s own spending, “+ the hotel, in the package”, and the package once for the whole trip. No invented split.</figcaption>
      </figure>
    </div>
  </body>
</html>
