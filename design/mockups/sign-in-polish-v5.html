<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Sign-in polish (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .phone { padding: 0 0 var(--space-6); }
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .u__line { color: var(--estimated); height: 10px; bottom: -0.55em; }
      .brand { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4); font-family: var(--font-title); font-weight: 600; font-size: var(--text-lg); }
      .pg { padding: 0 var(--space-4); }
      .pg h1 { font-family: var(--font-title); font-size: var(--text-3xl); font-weight: 600; text-align: center; margin: var(--space-2) 0 var(--space-2); }
      .pg .intro { text-align: center; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.45; margin-bottom: var(--space-4); }
      .sketch-box.sheet { padding: var(--space-6) var(--space-4) var(--space-4); margin-bottom: var(--space-4); }
      .field { margin-bottom: var(--space-3); }
      .eye { position: absolute; right: .7rem; top: 50%; transform: translateY(-50%); font-size: var(--text-xs); font-weight: 600; color: var(--confirmed); }
      .boxed { position: relative; }
      .msg { padding: var(--space-3); border-radius: 10px; font-size: var(--text-sm); line-height: 1.4; margin-bottom: var(--space-3); }
      .msg--error { background: var(--wash-over); color: var(--ink); border-left: 3px solid var(--over); }
      .msg--info { background: var(--wash-confirmed); border-left: 3px solid var(--confirmed); }
      .msg b { display: block; }
      .msg .act { display: inline-block; margin-top: .35rem; font-weight: 600; color: var(--confirmed); }
      .button { width: 100%; }
      .sw { text-align: center; font-size: var(--text-sm); color: var(--ink-soft); margin-top: var(--space-4); }
      .sw a, .link { color: var(--confirmed); font-weight: 600; }
      .demo-line { text-align: center; margin-top: var(--space-3); font-size: var(--text-sm); }
      .demo-line .hand { font-size: 1.15rem; display: block; }
      .aside { text-align: right; font-size: var(--text-sm); margin-top: -.3rem; }
      .err { color: var(--over); font-size: var(--text-xs); margin-top: .3rem; line-height: 1.35; }
      .ok { color: var(--confirmed); font-size: var(--text-xs); margin-top: .3rem; }

      .welcome-empty { padding: var(--space-6) var(--space-4) var(--space-4); text-align: center; margin: var(--space-4) var(--space-3); }
      .welcome-empty img { width: 220px; mix-blend-mode: multiply; display: block; margin: 0 auto; }
      .welcome-empty h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; margin-top: var(--space-2); }
      .welcome-empty p { color: var(--ink-soft); font-size: var(--text-md); line-height: 1.45; margin-top: var(--space-1); }
      .welcome-empty .button { margin-top: var(--space-4); }
      .welcome-empty .link { display: block; margin-top: var(--space-3); font-size: var(--text-sm); }
      .slip { margin: var(--space-3) var(--space-3) 0; padding: var(--space-3) var(--space-4); background: var(--paper-note); transform: rotate(-1deg); box-shadow: 0 1px 0 var(--line), 0 2px 6px rgb(31 42 36 / .08); }
      .slip p { font-family: var(--font-hand); font-size: 1.25rem; line-height: 1.2; }
      .top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); }
      .top h1 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; flex: 1; }
      .round { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; background: var(--paper-raised); }
      .sketch-box.card { margin: 0 var(--space-3) var(--space-4); padding: var(--space-4); }
      .card h2 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
      .kv { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--text-md); padding: .4rem 0; }
      .kv span { color: var(--ink-soft); }
      .small-note { font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.4; margin-top: var(--space-2); }
      .danger { border-color: var(--over) !important; color: var(--over) !important; background: transparent !important; }
      .confirm-box { margin-top: var(--space-3); padding: var(--space-3); border: 1.5px dashed var(--over); border-radius: 10px; font-size: var(--text-sm); line-height: 1.45; }
      .confirm-box ul { margin: var(--space-2) 0 var(--space-2) 1rem; }
      .confirm-box .row { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
      .confirm-box .row .button { flex: 1; }
      .button--danger { background: var(--over); border-color: var(--over); color: #fff; }

      .mail { background: #fff; margin: var(--space-4) var(--space-3); padding: var(--space-6) var(--space-4); border: 1px solid var(--line); border-radius: 10px; font-family: var(--font-text); }
      .mail .from { font-size: var(--text-xs); color: var(--ink-soft); border-bottom: 1px solid var(--line); padding-bottom: var(--space-2); margin-bottom: var(--space-4); }
      .mail .from b { color: var(--ink); }
      .mail .logo { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-title); font-weight: 600; font-size: var(--text-lg); justify-content: center; }
      .mail h2 { font-family: var(--font-title); text-align: center; font-size: var(--text-xl); margin: var(--space-4) 0 var(--space-2); }
      .mail p { font-size: var(--text-md); line-height: 1.5; color: var(--ink-soft); text-align: center; }
      .mail .button { margin: var(--space-4) 0 var(--space-3); }
      .mail small { display: block; text-align: center; font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.4; }
      figcaption ul { margin: var(--space-2) 0 0 1rem; }
      figcaption li { margin-top: .25rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Sign in: email not confirmed yet -->
      <figure>
        <div class="phone">
          <div class="brand"><img src="/illustrations/compass.svg" width="26" height="26" alt="" />Voyage Fare</div>
          <div class="pg">
            <h1><span class="u">Sign in</span></h1>
            <p class="intro">Welcome back. Your trips are where you left them.</p>
            <div class="msg msg--error"><b>Confirm your email first.</b>We sent a link to dana@mail.com when you signed up. Open it, then sign in.<br /><span class="act">Send the link again</span></div>
            <div class="sketch-box sketch-box--strong sheet" data-seed="11" style="padding:var(--space-6) var(--space-4) var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <div class="field"><label class="field__label">Email</label><input class="field__input" value="dana@mail.com" /></div>
              <div class="field"><label class="field__label">Password</label><div class="boxed"><input class="field__input" type="password" value="........" /><span class="eye">Show</span></div></div>
              <p class="aside"><span class="link">Forgot your password?</span></p>
            </div>
            <button class="button button--primary">Sign in</button>
            <p class="sw">New here? <a> Create an account</a></p>
            <p class="demo-line"><span class="hand">just looking?</span><span class="link">Try it with a real trip ›</span></p>
          </div>
        </div>
        <figcaption><b>1 · Sign in.</b>
          <ul>
            <li><b>Not confirmed yet:</b> the message says what to do and gives <b>“Send the link again”</b> right there (today you have to sign up again to get it).</li>
            <li><b>Added:</b> “just looking? Try it with a real trip ›” under the form, on sign in and on create account, for someone who came from a link.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. An old link -->
      <figure>
        <div class="phone">
          <div class="brand"><img src="/illustrations/compass.svg" width="26" height="26" alt="" />Voyage Fare</div>
          <div class="pg">
            <h1><span class="u">This link has expired</span></h1>
            <p class="intro">Links in our emails work once, for a day. No problem: we’ll send you a fresh one.</p>
            <div class="sketch-box sketch-box--strong sheet" data-seed="12" style="padding:var(--space-6) var(--space-4) var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <div class="field"><label class="field__label">Your email</label><input class="field__input" value="dana@mail.com" /></div>
            </div>
            <button class="button button--primary">Send me a new link</button>
            <p class="sw">Already confirmed? <a> Sign in</a></p>
          </div>
        </div>
        <figcaption><b>2 · An old or used link.</b> Today, opening an expired confirmation link just lands on the sign-in page with nothing said. Now it says what happened, and sends a new link: a new confirmation if the account isn’t confirmed yet, a new reset link if it was a password reset.</figcaption>
      </figure>

      <!-- 3. Create account: password checks -->
      <figure>
        <div class="phone">
          <div class="brand"><img src="/illustrations/compass.svg" width="26" height="26" alt="" />Voyage Fare</div>
          <div class="pg">
            <h1><span class="u">Create your account</span></h1>
            <div class="sketch-box sketch-box--strong sheet" data-seed="13" style="padding:var(--space-6) var(--space-4) var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <div class="field"><label class="field__label">Your first name</label><input class="field__input" value="Dana" /></div>
              <div class="field"><label class="field__label">Email</label><input class="field__input" value="dana@mail.com" /></div>
              <div class="field field--error"><label class="field__label">Password</label><div class="boxed"><input class="field__input" value="sunshine2024" /><span class="eye">Hide</span></div>
                <p class="err">This password has appeared in a data leak on another site. Choose another one: a short sentence works well.</p></div>
              <p class="small-note">We use your email only to sign you in and send you your links. Your trips are private: only the people you invite see them.</p>
            </div>
            <button class="button button--primary">Create account</button>
            <p class="demo-line"><span class="hand">just looking?</span><span class="link">Try it with a real trip ›</span></p>
          </div>
        </div>
        <figcaption><b>3 · Create account.</b>
          <ul>
            <li>Once you turn on <b>leaked password protection</b> in Supabase, a leaked password gets its own clear message (today it would say “too weak, try a longer one”, which is wrong).</li>
            <li><b>Added:</b> one line on what the email is for and that trips are private.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. First time in -->
      <figure>
        <div class="phone">
          <div class="top"><img src="/illustrations/compass.svg" width="26" height="26" alt="" /><h1>Your trips</h1><span class="avatar avatar--me" style="width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.8rem">D</span></div>
          <div class="slip"><p>Email confirmed, welcome Dana! Your notebook is ready.</p></div>
          <div class="sketch-box sketch-box--strong welcome-empty" data-seed="14">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--green" aria-hidden="true"></span>
            <img src="/illustrations/sketch-no-trips.webp" alt="" />
            <h2>Your first trip</h2>
            <p>Where to? Add the places, then what you’re thinking of: the app adds it up, for each of you.</p>
            <a class="button button--primary">+ Start a trip</a>
            <span class="link">or look at a real trip first ›</span>
          </div>
        </div>
        <figcaption><b>4 · The first time in.</b> Coming from the confirmation link, a note slipped in once: <b>“Email confirmed, welcome Dana!”</b> The empty page explains in one line how it works, with <b>“look at a real trip first”</b> (the demo) under the button.</figcaption>
      </figure>

      <!-- 5. Account -->
      <figure>
        <div class="phone">
          <div class="top"><span class="round">‹</span><h1>Your account</h1></div>
          <div class="sketch-box sketch-box--light card" data-seed="15" style="padding:var(--space-4)">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <h2>You</h2>
            <div class="kv"><span>First name</span><b>Dana</b></div>
            <div class="kv"><span>Email</span><b>dana@mail.com</b></div>
            <span class="link" style="font-size:var(--text-sm)">Change my email</span>
            <p class="small-note">We send a link to the new address; the change happens when you open it.</p>
          </div>
          <div class="sketch-box sketch-box--light card" data-seed="16" style="padding:var(--space-4)">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <h2>Delete my account</h2>
            <button class="button button--quiet danger">Delete my account…</button>
            <div class="confirm-box">
              <b>Delete your account for good?</b>
              <ul>
                <li>The trips only you are on are deleted.</li>
                <li>On shared trips (Colombia &amp; Panama), you become a name again: your share and what you paid stay, for the others.</li>
              </ul>
              This can’t be undone.
              <div class="row"><button class="button button--quiet">Keep it</button><button class="button button--danger">Yes, delete it</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>5 · Your account.</b> <b>Added:</b>
          <ul>
            <li><b>Change my email</b>, with a link to the new address.</li>
            <li><b>Delete my account</b>, which a public app needs (the law in Europe, and the app stores later). Shared trips keep working for the others, like when someone leaves a trip.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 6. The email -->
      <figure>
        <div class="phone" style="background:#f2f0ea">
          <div class="mail">
            <p class="from" style="text-align:left">From <b>Voyage Fare</b> · Subject: <b>Confirm your email</b></p>
            <div class="logo"><img src="/illustrations/compass.svg" width="26" height="26" alt="" />Voyage Fare</div>
            <h2>One tap and you’re in</h2>
            <p>Hi Dana, confirm your email to open your travel notebook.</p>
            <a class="button button--primary">Confirm my email</a>
            <small>The link works once, for a day. You didn’t sign up? Ignore this email.</small>
          </div>
        </div>
        <figcaption><b>6 · The emails.</b> Today they’re Supabase’s plain English ones (“Confirm your signup”). Three short ones in the app’s voice: <b>confirm your email</b>, <b>choose a new password</b>, <b>confirm your new email</b>.
          <ul>
            <li><b>To know:</b> Supabase’s own sender only delivers to your own address, a few per hour. Before testers sign up (step 6), the app needs its own sender (Resend, free) on the app’s address. I’ll prepare the templates now; the sender goes with going online.</li>
          </ul>
        </figcaption>
      </figure>

    </div>
    <script>
      const only = new URLSearchParams(location.search).get('only')
      if (only) document.querySelectorAll('.phones > figure').forEach((f, i) => { if (!only.split(',').includes(String(i + 1))) f.remove() })
    </script>
  </body>
</html>
