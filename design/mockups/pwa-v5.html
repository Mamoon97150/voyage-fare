<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — The app on the phone (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .phone { padding: 0 0 var(--space-6); }
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); }
      .top h1 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; flex: 1; }
      .me { width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: .8rem; font-weight: 600; box-shadow: 0 0 0 2px var(--estimated); }
      .pad { padding: 0 var(--space-3); }

      /* Install card */
      .install { padding: var(--space-4); margin-bottom: var(--space-4); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-3); align-items: start; }
      .app-icon { width: 3.2rem; height: 3.2rem; border-radius: 22%; background: var(--paper-raised); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--shadow-1); }
      .app-icon img { width: 76%; }
      .install h2 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .install p { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.4; }
      .install .acts { grid-column: 1 / -1; display: flex; gap: var(--space-2); margin-top: var(--space-2); }
      .install .acts .button { flex: 1; }
      .ios { grid-column: 1 / -1; margin-top: var(--space-2); padding: var(--space-3); border: 1.5px dashed var(--line); border-radius: 10px; font-size: var(--text-sm); line-height: 1.5; }
      .ios ol { margin: 0 0 0 1.1rem; }
      .ios .sym { display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; border: 1.5px solid var(--chosen); border-radius: 5px; color: var(--chosen); font-size: .7rem; vertical-align: middle; }
      .ghost { opacity: .45; }
      .mini-trip { padding: var(--space-3) var(--space-4); }
      .mini-trip b { font-family: var(--font-title); font-size: var(--text-lg); }
      .mini-trip span { display: block; font-size: var(--text-sm); color: var(--ink-soft); }

      /* Home screen */
      .home { background: linear-gradient(160deg, #2c4a7a 0%, #2f6b4f 100%); min-height: 33rem; padding: var(--space-8) var(--space-4); display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-6) var(--space-3); align-content: start; }
      .home-app { display: flex; flex-direction: column; align-items: center; gap: .35rem; font-size: .7rem; color: #fff; text-align: center; }
      .home-app i { width: 3.4rem; height: 3.4rem; border-radius: 22%; background: rgba(255,255,255,.25); display: block; }
      .home-app .app-icon { width: 3.4rem; height: 3.4rem; border: 0; }
      .splash { margin-top: var(--space-4); }
      .splash-screen { background: var(--paper); border-radius: 14px; height: 13rem; display: grid; place-items: center; text-align: center; margin: var(--space-3); }
      .splash-screen img { width: 4.5rem; display: block; margin: 0 auto var(--space-2); }
      .splash-screen b { font-family: var(--font-title); font-size: var(--text-lg); }

      /* Shared from Instagram */
      .sheet { padding: var(--space-6) var(--space-4) var(--space-4); margin: var(--space-3); }
      .sheet h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; }
      .sheet h2 small { font-family: var(--font-hand); font-size: 1.15rem; color: var(--ink-soft); font-weight: 400; margin-left: .4rem; }
      .pasted { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-3) 0; padding: var(--space-2) var(--space-3); border: 1.5px dashed var(--line); border-radius: 10px; font-size: var(--text-xs); color: var(--ink-soft); }
      .badge { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 4px; font-size: .65rem; font-weight: 700; color: #fff; background: linear-gradient(45deg, #f09433, #dc2743 60%, #bc1888); flex: none; }
      .pasted b { display: block; font-size: var(--text-sm); color: var(--ink); }
      .field { margin-bottom: var(--space-3); }
      .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-1) 0 var(--space-3); }
      .chips .chip { min-height: 2.1rem; font-size: .8125rem; }
      .acts2 { display: flex; gap: var(--space-2); justify-content: flex-end; }
      .paste { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .7rem; border: 1.5px solid var(--ink); border-radius: 999px; font-size: var(--text-xs); font-weight: 600; background: var(--paper-raised); }
      .link-row { display: flex; gap: var(--space-2); align-items: center; }
      .link-row .field__input { flex: 1; }

      /* Offline */
      .offline-strip { margin: 0 var(--space-3) var(--space-3); padding: var(--space-2) var(--space-3); border-radius: 10px; background: var(--paper-note); border: 1.5px dashed var(--ink-soft); font-size: var(--text-sm); line-height: 1.4; display: flex; gap: var(--space-2); align-items: baseline; }
      .offline-strip b { white-space: nowrap; }
      .offline-page { text-align: center; padding: var(--space-6) var(--space-4); margin: var(--space-3); }
      .offline-page img { width: 200px; mix-blend-mode: multiply; }
      .offline-page h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; margin-top: var(--space-2); }
      .offline-page p { color: var(--ink-soft); font-size: var(--text-md); line-height: 1.45; margin-top: var(--space-1); }
      .offline-page .button { margin-top: var(--space-4); }
      .words { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); margin: var(--space-4) var(--space-3) var(--space-1); }
      figcaption ul { margin: var(--space-2) 0 0 1rem; }
      figcaption li { margin-top: .25rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Install card -->
      <figure>
        <div class="phone">
          <div class="top"><img src="/illustrations/compass.svg" width="26" height="26" alt="" /><h1>Your trips</h1><span class="me">D</span></div>
          <div class="pad">
            <div class="sketch-box sketch-box--strong install" data-seed="21">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <span class="app-icon"><img src="/illustrations/compass.svg" alt="" /></span>
              <span><h2>Keep it on your phone</h2><p>One tap from your home screen, full screen, like an app. Free, nothing to download from a store.</p></span>
              <div class="acts"><button class="button button--quiet">Not now</button><button class="button button--primary">Add to home screen</button></div>
              <div class="ios">
                <b>On iPhone:</b>
                <ol>
                  <li>tap <span class="sym">⬆</span> Share at the bottom of Safari,</li>
                  <li>then <b>Add to Home Screen</b>.</li>
                </ol>
              </div>
            </div>
            <div class="sketch-box sketch-box--light mini-trip ghost" data-seed="22"><svg class="sketch-box__line" aria-hidden="true"></svg><b>Lisbon &amp; Porto</b><span>12 – 20 Apr 2027 · in 148 days</span></div>
          </div>
        </div>
        <figcaption><b>1 · “Keep it on your phone”.</b> A card at the top of Your trips, once you have a trip, only in the browser (not once it’s installed).
          <ul>
            <li><b>Android:</b> “Add to home screen” installs it in one tap.</li>
            <li><b>iPhone:</b> Apple doesn’t allow a button, so the card shows the 2 steps in Safari (both are shown here; each phone sees its own).</li>
            <li>“Not now” hides it for a month.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. On the home screen -->
      <figure>
        <div class="phone" style="padding:0">
          <div class="home">
            <span class="home-app"><i></i>Photos</span>
            <span class="home-app"><i></i>Maps</span>
            <span class="home-app"><span class="app-icon"><img src="/illustrations/compass.svg" alt="" /></span>Voyage Fare</span>
            <span class="home-app"><i></i>Instagram</span>
            <span class="home-app"><i></i>Mail</span>
            <span class="home-app"><i></i>Notes</span>
          </div>
          <p class="words">Opening it: a moment on the paper, then your trips</p>
          <div class="splash-screen"><div><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b></div></div>
        </div>
        <figcaption><b>2 · On the home screen.</b> The compass on the notebook’s paper colour, named <b>Voyage Fare</b>. It opens full screen (no browser bar), on Your trips, with the paper colour while it loads. The bottom bar of a trip stays clear of the phone’s own bar.</figcaption>
      </figure>

      <!-- 3. Shared from Instagram -->
      <figure>
        <div class="phone">
          <div class="sketch-box sketch-box--strong sheet" data-seed="23" style="padding:var(--space-6) var(--space-4) var(--space-4)">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h2>To try<small>shared from Instagram</small></h2>
            <div class="pasted"><span class="badge">IG</span><span><b>Instagram</b>instagram.com/p/C9xK2…</span></div>
            <span class="field__label">Which trip?</span>
            <div class="chips"><button class="chip" aria-pressed="true">Lisbon &amp; Porto</button><button class="chip" aria-pressed="false">Japan</button></div>
            <span class="field__label">Where?</span>
            <div class="chips"><button class="chip" aria-pressed="false">Lisbon</button><button class="chip" aria-pressed="false">Sintra</button><button class="chip" aria-pressed="true">Porto</button></div>
            <div class="field"><label class="field__label">Name</label><input class="field__input" value="Cantinho do Avillez" /></div>
            <div class="field"><label class="field__label">A note <span style="font-weight:400;color:var(--ink-soft)">(optional)</span></label><input class="field__input" value="the francesinha" /></div>
            <div class="acts2"><button class="button button--quiet">Cancel</button><button class="button button--primary">Add to To try</button></div>
          </div>
          <p class="words">On iPhone, in the To try form</p>
          <div class="sketch-box sketch-box--light sheet" data-seed="24" style="padding-top:var(--space-4)">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="field__label">Link</span>
            <div class="link-row"><input class="field__input" placeholder="Paste the post…" /><span class="paste">📋 Paste</span></div>
            <p class="hand" style="font-size:1.1rem;margin-top:.3rem">in Instagram: ⋯ → Copy link, then Paste here</p>
          </div>
        </div>
        <figcaption><b>3 · Sharing a post to To try.</b>
          <ul>
            <li><b>Android:</b> Voyage Fare is in the phone’s <b>Share</b> menu. Sharing a post opens this sheet with the link in: pick the trip (the next one first), the place, a name, done.</li>
            <li><b>iPhone:</b> Apple doesn’t let web apps into its Share menu. Instead, the To try form gets a <b>📋 Paste</b> button: “Copy link” in Instagram, then one tap.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. Offline -->
      <figure>
        <div class="phone">
          <div class="top"><img src="/illustrations/compass.svg" width="26" height="26" alt="" /><h1>Your trips</h1><span class="me">D</span></div>
          <div class="offline-strip"><b>● Offline.</b><span>You’re seeing what was loaded last. Changes need a connection.</span></div>
          <div class="pad"><div class="sketch-box sketch-box--light mini-trip" data-seed="25"><svg class="sketch-box__line" aria-hidden="true"></svg><b>Lisbon &amp; Porto</b><span>12 – 20 Apr 2027 · in 148 days</span></div></div>
          <p class="words">Opening it with no connection at all</p>
          <div class="sketch-box sketch-box--light offline-page" data-seed="26">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <img src="/illustrations/sketch-no-trips.webp" alt="" />
            <h2>No connection</h2>
            <p>Your trips need the internet to open. They’ll be here as soon as you’re back online.</p>
            <button class="button button--quiet">Try again</button>
          </div>
        </div>
        <figcaption><b>4 · Without a connection.</b> The app itself opens without the internet (the pages, the fonts, the drawings are kept on the phone).
          <ul>
            <li>If you lose the connection while using it: a note at the top, <b>“Offline”</b>, and what’s on screen stays.</li>
            <li>Opening it with no connection: <b>“No connection”</b> and a Try again button, instead of an empty page.</li>
            <li>Not in this step: reading your trips offline (that needs a copy of them on the phone: later, if testers ask).</li>
          </ul>
        </figcaption>
      </figure>

    </div>
    <script>
      const only = new URLSearchParams(location.search).get('only')
      if (only) document.querySelectorAll('.phones > figure').forEach((f, i) => { if (!only.split(',').includes(String(i + 1))) f.remove() })
    </script>
  </body>
</html>
