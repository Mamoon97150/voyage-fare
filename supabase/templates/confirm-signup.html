<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px 12px;background:#fbf7ef;font-family:Helvetica,Arial,sans-serif;color:#1f2a24">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fffdf8;border:1px solid #e4dccb;border-radius:12px">
            <tr>
              <td style="padding:32px 28px;text-align:center">
                <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:20px;font-weight:bold">Voyage Fare</p>
                <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-size:24px;font-weight:bold">One tap and you’re in</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#55615a">Hi {{ .Data.first_name }}, confirm your email to open your travel notebook.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;background:#1f2a24;color:#fbf7ef;border-radius:999px;font-size:16px;font-weight:bold;text-decoration:none">Confirm my email</a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#55615a">The link works once, for an hour. You didn’t sign up? Ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
