<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Compare v4 (calmer head, notebook top, chosen colour)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import rough from 'roughjs'
      const pen = (svg, seed) => ({ seed, roughness: 1, bowing: 1, strokeWidth: 1.2, stroke: 'currentColor' })
      // Sheets: the app's SketchBox outline.
      for (const el of document.querySelectorAll('.sketch-box')) {
        const svg = el.querySelector('.sketch-box__line')
        const { width, height } = el.getBoundingClientRect()
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`)
        svg.appendChild(rough.svg(svg).rectangle(2, 2, width - 4, height - 4, pen(svg, Number(el.dataset.seed) || 7)))
      }
      // Folder tabs.
      for (const tab of document.querySelectorAll('.ftab')) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.setAttribute('class', 'ftab__line')
        tab.prepend(svg)
        const { width, height } = tab.getBoundingClientRect()
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`)
        const on = tab.classList.contains('ftab--on')
        svg.appendChild(rough.svg(svg).linearPath([[2, height + (on ? 2 : 0)], [5, 4], [width - 5, 4], [width - 2, height + (on ? 2 : 0)]], { seed: width | 0, roughness: 0.9, bowing: 0.6, strokeWidth: 1.2, stroke: 'currentColor' }))
      }
      // The budget bar, coloured in by hand: hatched green (confirmed), hatched mustard (estimated), pencil outline.
      for (const bar of document.querySelectorAll('.hbar')) {
        const svg = bar.querySelector('svg')
        const { width, height } = bar.getBoundingClientRect()
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`)
        const r = rough.svg(svg)
        const c = Number(bar.dataset.confirmed), e = Number(bar.dataset.estimated)
        const w = width - 4
        svg.appendChild(r.rectangle(2, 3, w * c, height - 6, { seed: 3, roughness: 1.2, fill: '#2f6b4f', fillStyle: 'hachure', hachureGap: 3, fillWeight: 1.4, stroke: 'none' }))
        svg.appendChild(r.rectangle(2 + w * c, 3, w * e, height - 6, { seed: 4, roughness: 1.2, fill: '#e2a93b', fillStyle: 'hachure', hachureGap: 3, fillWeight: 1.4, stroke: 'none' }))
        svg.appendChild(r.rectangle(2, 2, w, height - 4, { seed: 5, roughness: 0.9, bowing: 1, strokeWidth: 1.1, stroke: '#55615a' }))
      }
      // Hand underline under the active word of the toggle and the chosen names.
      for (const u of document.querySelectorAll('.u')) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.setAttribute('class', 'u__line')
        u.append(svg)
        const { width } = u.getBoundingClientRect()
        svg.setAttribute('viewBox', `0 0 ${width} 8`)
        svg.appendChild(rough.svg(svg).curve([[0, 5], [width * 0.4, 3], [width * 0.8, 4], [width, 2]], { seed: width | 0, roughness: 0.8, strokeWidth: 1.8, stroke: 'currentColor' }))
      }
    </script>
    <style>
      .phones .phone { background: var(--paper); position: relative; padding-bottom: 5rem; }
      .phone .trip-nav { position: absolute; left: 0; right: 0; bottom: 0; transform: none; max-width: none; }
      .phone .screen { min-height: 0; }
      .money__fig { font-variant-numeric: normal; }
      figcaption { max-width: 22.5rem; margin: var(--space-3) auto 0; font-size: 0.8125rem; color: var(--ink-soft); line-height: 1.45; }
      figcaption b { color: var(--ink); }

      /* The chosen colour, one variable: blue ink (proposed). */
      .phone, .swatch { --chosen: #2c4a7a; }
      .swatch--green { --chosen: #2f6b4f; }
      .swatch--terra { --chosen: #b0603c; }

      /* ── 1 · The top: a notebook cover, not an app bar ─────────────────────── */
      .cover { padding: var(--space-4) var(--space-4) var(--space-2); }
      .cover__row { display: flex; align-items: flex-start; gap: var(--space-3); }
      .cover__back { font-size: 1.5rem; line-height: 1.2; color: var(--ink-soft); padding-right: 0.1rem; }
      .cover__title { flex: 1; min-width: 0; }
      .cover__title h1 { font-family: var(--font-title); font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
      .cover__title p { font-family: var(--font-hand); font-size: 1.15rem; color: var(--ink-soft); line-height: 1.1; }
      .cover .avatars { margin-top: 0.15rem; }
      .money { display: flex; align-items: baseline; gap: var(--space-2); margin-top: var(--space-3); }
      .money__fig { font-family: var(--font-title); font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .money__who { margin-left: auto; font-size: 0.875rem; color: var(--ink-soft); }
      .money__who .on { color: var(--ink); font-weight: 600; }
      .u { position: relative; display: inline-block; }
      .u__line { position: absolute; left: -2px; right: -2px; bottom: -0.45em; width: calc(100% + 4px); height: 8px; overflow: visible; color: var(--estimated); }
      .hbar { position: relative; height: 16px; margin-top: var(--space-2); }
      .hbar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .legend { display: flex; justify-content: space-between; margin-top: 0.35rem; font-size: 0.75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .legend b { font-weight: 600; color: var(--confirmed); }
      .legend b.est { color: var(--estimated-ink); }

      /* ── Tabs on the sheet (v3) ─────────────────────────────────────────────── */
      .ftabs { display: flex; gap: 2px; padding: var(--space-3) var(--space-4) 0; margin-bottom: -1px; position: relative; z-index: 1; }
      .ftab { position: relative; padding: 0.45rem 0.6rem 0.4rem; font-size: 0.8125rem; color: var(--ink-soft); background: var(--paper); }
      .ftab--on { background: var(--paper-raised); color: var(--ink); font-weight: 600; }
      .ftab__line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; color: var(--ink-soft); opacity: 0.7; }
      .ftab--todo::after { content: ''; position: absolute; top: 0.3rem; right: 0.25rem; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--estimated); }
      .sheet-wrap { padding: 0 var(--space-3); }
      .sketch-box.cmp { padding: 0 var(--space-4) var(--space-3); }

      /* ── 2 · The page head, calmer: the place, its dates by hand, neighbours in the corners ── */
      .pagehead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: var(--space-4) 0 var(--space-2); }
      .pagehead__nav { font-size: 0.75rem; color: var(--ink-soft); padding-top: 0.45rem; }
      .pagehead__nav--next { text-align: right; }
      .pagehead__mid { text-align: center; }
      .pagehead h2 { font-family: var(--font-title); font-size: 1.5rem; font-weight: 600; line-height: 1.15; }
      .pagehead p { font-family: var(--font-hand); font-size: 1.15rem; color: var(--ink-soft); line-height: 1.1; }

      /* ── 3 · Rows (v3), the chosen one in the chosen colour ─────────────────── */
      .item-group__label .what { color: var(--ink); }
      .opt { display: grid; grid-template-columns: 1.75rem 1fr auto; gap: 0 var(--space-3); align-items: start; padding: 0.7rem 0; border-top: 1px solid var(--line); }
      .opt:first-child { border-top: 0; }
      .pick { width: 1.5rem; height: 1.5rem; margin-top: 0.05rem; border: 1.5px solid var(--ink-soft); border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; color: var(--paper); }
      .opt--chosen .pick { background: var(--chosen); border-color: var(--chosen); }
      .opt__name { font-weight: 600; }
      .opt--chosen .opt__name { color: var(--chosen); }
      .opt--chosen .u__line { color: var(--chosen); }
      .opt__meta { display: block; font-size: 0.8125rem; color: var(--ink-soft); margin-top: 0.1rem; }
      .opt--chosen .opt__meta { margin-top: 0.45rem; }
      .opt__amount { text-align: right; font-weight: 700; }
      .opt__tag { display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 0.15rem; }
      .opt__tag--best { color: var(--confirmed); }
      .heart { color: var(--estimated); }
      .add-row { margin: var(--space-2) 0 var(--space-1); color: var(--confirmed); }

      /* ── The colour choice, side by side ─────────────────────────────────────── */
      .swatches { width: 22.5rem; max-width: 100%; display: flex; flex-direction: column; gap: var(--space-4); }
      .swatch { padding: var(--space-3) var(--space-4); background: var(--paper-raised); border-radius: 14px; box-shadow: 0 4px 16px rgb(31 42 36 / 0.08); }
      .swatch h3 { font-family: var(--font-title); font-size: 1rem; margin-bottom: 0.1rem; }
      .swatch > p { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: var(--space-2); }
    </style>
  </head>
  <body>
    <div class="phones">
      <figure>
        <div class="phone">
          <div class="screen screen--trip">
            <!-- 1 · The cover -->
            <header class="cover">
              <div class="cover__row">
                <span class="cover__back" aria-label="All trips">‹</span>
                <div class="cover__title">
                  <h1>Colombia &amp; Panama</h1>
                  <p>4 – 18 Sept · the four of us</p>
                </div>
                <a class="avatars"><span class="avatar avatar--me">D</span><span class="avatar">P</span><span class="avatar">D</span><span class="avatar">G</span></a>
              </div>
              <div class="money">
                <span class="money__fig">2 912 €</span>
                <span class="money__who"><span class="on u">your share</span> · total</span>
              </div>
              <div class="hbar" data-confirmed="0.9" data-estimated="0.1"><svg aria-hidden="true"></svg></div>
              <div class="legend"><span><b>2 627 €</b> confirmed</span><span><b class="est">285 €</b> still estimated</span></div>
            </header>

            <div class="ftabs" role="tablist">
              <span class="ftab">Travel</span><span class="ftab">Stay</span><span class="ftab">Around</span><span class="ftab ftab--on">Activities</span><span class="ftab ftab--todo">Food</span>
            </div>
            <div class="sheet-wrap">
              <div class="sketch-box sketch-box--light cmp" data-seed="34">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <!-- 2 · The page head -->
                <header class="pagehead">
                  <span class="pagehead__nav">‹ Medellín</span>
                  <div class="pagehead__mid">
                    <h2>Cartagena</h2>
                    <p>5 nights · 12 – 17 Sept</p>
                  </div>
                  <span class="pagehead__nav pagehead__nav--next">Panama ›</span>
                </header>

                <div class="item-group">
                  <p class="item-group__label">Day 11 · <span class="what">Peggy’s photoshoot</span> · for 3</p>
                  <div class="opt opt--chosen">
                    <span class="pick">✓</span>
                    <span><span class="opt__name"><span class="u">Fly Dress Colombia</span> <span class="heart">♥</span></span><span class="opt__meta">230 $ for 3 · ≈ 208 €</span></span>
                    <span class="opt__amount num">67 €<span class="opt__tag" style="color: var(--confirmed)">● Paid</span></span>
                  </div>
                  <div class="opt">
                    <span class="pick"></span>
                    <span><span class="opt__name">Private shoot (Viator)</span><span class="opt__meta">90 $ for 3 · ≈ 81 € · 1 h 30</span></span>
                    <span class="opt__amount num">27 €<span class="opt__tag opt__tag--best">Cheapest</span></span>
                  </div>
                  <div class="opt">
                    <span class="pick"></span>
                    <span><span class="opt__name">Fly Dress, bigger package</span><span class="opt__meta">310 $ for 3 · ≈ 280 €</span></span>
                    <span class="opt__amount num">93 €<span class="opt__tag">+66 €</span></span>
                  </div>
                  <button class="add-row" type="button"><span class="add-row__plus">+</span>Add an option</button>
                </div>

                <div class="item-group">
                  <p class="item-group__label">Day 13 · <span class="what">Day trip</span></p>
                  <div class="opt opt--chosen">
                    <span class="pick">✓</span>
                    <span><span class="opt__name"><span class="u">San Basilio de Palenque</span></span><span class="opt__meta">440 $ for 4 · ≈ 398 € · Black Legacy</span></span>
                    <span class="opt__amount num">99 €<span class="opt__tag">+64 €</span></span>
                  </div>
                  <div class="opt">
                    <span class="pick"></span>
                    <span><span class="opt__name">Volcán del Totumo</span><span class="opt__meta">140 € for 4 · mud bath</span></span>
                    <span class="opt__amount num">35 €<span class="opt__tag opt__tag--best">Cheapest</span></span>
                  </div>
                </div>
              </div>
            </div>
            <nav class="trip-nav"><a><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"></path></svg>Trip</a><a class="active"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="6" height="14" rx="1.5"></rect><rect x="14" y="5" width="6" height="14" rx="1.5"></rect></svg>Compare</a><a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v8l6 5"></path></svg>Budget</a><a><svg viewBox="0 0 24 24"><path d="M4 9h14l-3-3M20 15H6l3 3"></path></svg>Who paid</a></nav>
          </div>
        </div>
        <figcaption>
          <b>1 · The top is a notebook cover:</b> the trip’s name, its dates by hand, your share in the title font, “your share · total” as words (the active one underlined by hand), and the bar coloured in with pencil hatching. The same top on the trip page. “No target set” only shows when there is one to talk about.<br />
          <b>2 · The page head is calmer:</b> just the place and its dates by hand; the neighbours in the corners (“‹ Medellín”, “Panama ›”) turn the page. No number, no round buttons.<br />
          <b>3 · Chosen in blue ink</b>, like circling it with a pen.
        </figcaption>
      </figure>

      <!-- The chosen colour, three choices -->
      <figure>
        <div class="swatches">
          <div class="swatch">
            <h3>Blue ink (proposed)</h3>
            <p>A pen in the notebook. Means nothing else in the app, so no mix-up with the budget’s colours.</p>
            <div class="opt opt--chosen"><span class="pick">✓</span><span><span class="opt__name"><span class="u">Fly Dress Colombia</span></span><span class="opt__meta">230 $ for 3 · ≈ 208 €</span></span><span class="opt__amount num">67 €<span class="opt__tag">Paid</span></span></div>
            <div class="opt"><span class="pick"></span><span><span class="opt__name">Private shoot (Viator)</span><span class="opt__meta">90 $ for 3</span></span><span class="opt__amount num">27 €<span class="opt__tag opt__tag--best">Cheapest</span></span></div>
          </div>
          <div class="swatch swatch--green">
            <h3>Forest green</h3>
            <p>The app’s colour, but green already means “confirmed” (paid or booked): a chosen idea could look paid.</p>
            <div class="opt opt--chosen"><span class="pick">✓</span><span><span class="opt__name"><span class="u">Fly Dress Colombia</span></span><span class="opt__meta">230 $ for 3 · ≈ 208 €</span></span><span class="opt__amount num">67 €<span class="opt__tag">Paid</span></span></div>
            <div class="opt"><span class="pick"></span><span><span class="opt__name">Private shoot (Viator)</span><span class="opt__meta">90 $ for 3</span></span><span class="opt__amount num">27 €<span class="opt__tag opt__tag--best">Cheapest</span></span></div>
          </div>
          <div class="swatch swatch--terra">
            <h3>Terracotta</h3>
            <p>Warm, travel-poster. Close to the red that means “over budget”, so a little risky.</p>
            <div class="opt opt--chosen"><span class="pick">✓</span><span><span class="opt__name"><span class="u">Fly Dress Colombia</span></span><span class="opt__meta">230 $ for 3 · ≈ 208 €</span></span><span class="opt__amount num">67 €<span class="opt__tag">Paid</span></span></div>
            <div class="opt"><span class="pick"></span><span><span class="opt__name">Private shoot (Viator)</span><span class="opt__meta">90 $ for 3</span></span><span class="opt__amount num">27 €<span class="opt__tag opt__tag--best">Cheapest</span></span></div>
          </div>
        </div>
      </figure>
    </div>
  </body>
</html>
