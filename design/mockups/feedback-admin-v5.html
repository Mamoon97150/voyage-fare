<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Feedback and Admin (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 18%, transparent); z-index: 4; }
      .top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border-bottom: 1px solid var(--line); }
      .top img { width: 26px; }
      .top b { font-family: var(--font-title); font-size: var(--text-lg); flex: 1; }
      .me { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: .85rem; font-weight: 600; box-shadow: 0 0 0 2px var(--estimated); position: relative; }
      .me i { position: absolute; top: -3px; right: -3px; width: .7rem; height: .7rem; border-radius: 50%; background: var(--estimated); border: 2px solid var(--paper); }
      .ghost { opacity: .35; padding: var(--space-4); }
      .ghost .card { height: 7rem; border: 1px solid var(--line); border-radius: 10px; margin-top: var(--space-3); }
      .sketch-box.sheet-up { margin: 0; position: absolute; left: var(--space-2); right: var(--space-2); bottom: var(--space-2); z-index: 6; padding: var(--space-6) var(--space-4) var(--space-4); }
      .sheet-up h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; }
      .lead { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.45; margin-top: var(--space-1); }
      .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
      .chips .chip { min-height: 2.1rem; font-size: .8125rem; }
      .area { margin-top: var(--space-3); min-height: 6rem; padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: var(--text-md); color: var(--ink); }
      .attached { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.45; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); margin-top: var(--space-2); }
      .switch-row small { display: block; color: var(--ink-soft); font-size: var(--text-xs); }
      .sw { width: 2.6rem; height: 1.5rem; border-radius: 999px; background: var(--confirmed); position: relative; flex: none; }
      .sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--paper-raised); }
      .acts { margin-top: var(--space-4); display: grid; gap: var(--space-2); }
      .thanks { position: absolute; left: var(--space-3); right: var(--space-3); bottom: var(--space-4); z-index: 6; padding: var(--space-3) var(--space-4); background: var(--paper-note); border: 1.5px dashed var(--ink-soft); border-radius: 10px; box-shadow: var(--shadow-1); transform: rotate(-.4deg); }
      .thanks b::before { content: '✓'; display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--confirmed); color: var(--paper); font-size: var(--text-xs); margin-right: var(--space-2); }
      .thanks p { font-size: var(--text-sm); color: var(--ink-soft); margin-top: var(--space-1); }
      .sketch-box.acc { margin: 0; position: absolute; right: var(--space-3); top: 4.2rem; z-index: 6; width: 16.5rem; padding: var(--space-2); }
      .acc a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-3); font-size: var(--text-md); color: var(--ink); }
      .acc a i { width: 1.2rem; text-align: center; font-style: normal; color: var(--ink-soft); }
      .acc a small { margin-left: auto; padding: 0 .45rem; border-radius: 999px; background: var(--estimated); color: var(--ink); font-size: var(--text-2xs); font-weight: 700; }
      .acc hr { border: 0; border-top: 1px solid var(--line); margin: var(--space-1) 0; }
      .admin { padding: var(--space-4); }
      .admin h1 { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
      .stat { padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: 10px; background: var(--paper-raised); }
      .stat b { display: block; font-family: var(--font-title); font-size: var(--text-xl); }
      .stat span { font-size: var(--text-xs); color: var(--ink-soft); }
      .tabs { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
      .msg { margin-top: var(--space-3); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); }
      .msg .head { display: flex; justify-content: space-between; gap: var(--space-2); align-items: baseline; }
      .msg .kind { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink); }
      .msg .when { font-size: var(--text-xs); color: var(--ink-soft); }
      .msg p { font-size: var(--text-sm); line-height: 1.45; margin-top: var(--space-1); }
      .msg .meta { font-size: var(--text-xs); color: var(--ink-soft); margin-top: var(--space-2); }
      .msg .row { display: flex; gap: var(--space-3); margin-top: var(--space-2); font-size: var(--text-sm); font-weight: 600; }
      .msg .row a { color: var(--chosen); }
      .done { opacity: .5; }
      .new-dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--estimated); margin-right: .35rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. The form -->
      <figure>
        <div class="phone" style="min-height:40rem;padding-bottom:0">
          <div class="top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><span class="me">A</span></div>
          <div class="ghost"><div class="card"></div><div class="card"></div></div>
          <div class="scrim"></div>
          <div class="sketch-box sketch-box--strong sheet-up" data-seed="81">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h2>Send feedback</h2>
            <p class="lead">Something broken, unclear, or an idea? Djamina reads every message.</p>
            <div class="chips">
              <button class="chip" aria-pressed="true">Something’s broken</button>
              <button class="chip">Something’s unclear</button>
              <button class="chip">An idea</button>
              <button class="chip">I love it</button>
            </div>
            <div class="area">The Budget page shows 0 € for Medellín but I added the hotel…</div>
            <p class="attached">Sent with it: the page you’re on (<b>Budget · Colombia &amp; Panama</b>), your phone and browser. Nothing else.</p>
            <div class="switch-row"><span>You can write back to me<small>at ana@mail.com</small></span><span class="sw"></span></div>
            <div class="acts"><a class="button button--primary button--wide">Send</a></div>
          </div>
        </div>
        <figcaption><b>1 · Send feedback</b> (account menu → Send feedback, from any page). A sheet instead of the email app.
          <ul>
            <li><b>What kind</b>, one tap: broken · unclear · an idea · I love it.</li>
            <li><b>The message</b>, and what’s sent with it, said plainly: the page, the phone and browser.</li>
            <li><b>You can write back to me</b> (on): the answer comes by email.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. Sent -->
      <figure>
        <div class="phone" style="min-height:40rem;padding-bottom:0">
          <div class="top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><span class="me">A</span></div>
          <div class="ghost" style="opacity:.6"><div class="card"></div><div class="card"></div><div class="card"></div></div>
          <div class="thanks" role="status"><b>Thank you, Ana!</b><p>It’s with Djamina. If you said she can, she’ll write back to you by email.</p></div>
        </div>
        <figcaption><b>2 · Sent.</b> The note slipped into the notebook, then back to where you were.</figcaption>
      </figure>

      <!-- 3. The Admin entry -->
      <figure>
        <div class="phone" style="min-height:40rem;padding-bottom:0">
          <div class="top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><span class="me">D<i></i></span></div>
          <div class="ghost"><div class="card"></div></div>
          <div class="scrim" style="top:4rem"></div>
          <div class="sketch-box sketch-box--strong acc" data-seed="82">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <a><i>▤</i>Your trips</a>
            <a><i>◎</i>See the demo</a>
            <a style="font-weight:600"><i>✉</i>Admin<small>2 new</small></a>
            <hr />
            <a><i>⚙</i>Your account</a>
            <a><i>§</i>Privacy</a>
            <a style="color:var(--ink-soft)"><i>↩</i>Sign out</a>
          </div>
        </div>
        <figcaption><b>3 · For you only: Admin.</b> In your account menu, with how many new messages; a small mustard dot on your initial when there are some. Nobody else sees it (checked by the database, not just hidden).</figcaption>
      </figure>

      <!-- 4. The Admin page -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><img src="/illustrations/compass.svg" alt="" /><b>Voyage Fare</b><span class="me">D</span></div>
          <div class="admin">
            <h1>Admin</h1>
            <p class="hand">what testers tell you, and how it’s going</p>
            <div class="stats">
              <div class="stat"><b>6</b><span>accounts</span></div>
              <div class="stat"><b>9</b><span>trips</span></div>
              <div class="stat"><b>2</b><span>new messages</span></div>
            </div>
            <div class="tabs"><button class="chip" aria-pressed="true">New · 2</button><button class="chip">All · 5</button></div>
            <div class="sketch-box sketch-box--light msg" data-seed="83">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <div class="head"><span class="kind"><span class="new-dot"></span>Something’s broken</span><span class="when">today 18:42</span></div>
              <p>The Budget page shows 0 € for Medellín but I added the hotel…</p>
              <p class="meta">Ana · ana@mail.com · Budget · Colombia &amp; Panama · iPhone, Safari</p>
              <div class="row"><a>Reply by email</a><a>Done</a></div>
            </div>
            <div class="sketch-box sketch-box--light msg" data-seed="84">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <div class="head"><span class="kind"><span class="new-dot"></span>An idea</span><span class="when">yesterday</span></div>
              <p>Could we see the hotels on a map when comparing?</p>
              <p class="meta">Talisa · doesn’t want a reply · Compare · Dubai · Android, Chrome</p>
              <div class="row"><a>Done</a></div>
            </div>
          </div>
        </div>
        <figcaption><b>4 · The Admin page.</b>
          <ul>
            <li>Three numbers: accounts, trips, new messages (handy for the case study too).</li>
            <li>The messages, newest first: kind, text, who, where in the app, which phone.</li>
            <li><b>Reply by email</b> (only if they said yes) opens your mail to them; <b>Done</b> moves it to All.</li>
            <li>Emails to hello@ aren’t here: they stay in the Resend inbox, recapped in your pro brief.</li>
          </ul>
        </figcaption>
      </figure>

    </div>
  </body>
</html>
