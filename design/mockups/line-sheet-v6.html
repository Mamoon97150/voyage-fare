<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A line, shorter (v6, 16 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: var(--space-4); }
      .kicker { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .sheet { position: relative; margin-top: var(--space-3); padding: var(--space-4); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; }
      .head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: baseline; }
      .head h3 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; color: var(--ink); line-height: 1.2; }
      .head .amt { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; }
      .meta { grid-column: 1 / -1; font-size: var(--text-sm); color: var(--ink-soft); }
      .meta .cat-dot { margin-right: .3rem; }
      .track { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: var(--space-4); position: relative; }
      .track::before { content: ''; position: absolute; left: 16%; right: 16%; top: .55rem; border-top: 2px dashed var(--line); }
      .stp { display: grid; justify-items: center; gap: .3rem; font-size: var(--text-xs); color: var(--ink-soft); position: relative; }
      .stp i { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--line); background: var(--paper-raised); }
      .stp.on i { border-color: var(--estimated); background: var(--estimated); }
      .stp.ok i { border-color: var(--confirmed); background: var(--confirmed); }
      .stp.on, .stp.ok { color: var(--ink); font-weight: 600; }
      .next { margin-top: var(--space-4); }
      .next .button { width: 100%; }
      .rows { margin-top: var(--space-4); border-top: 1px solid var(--line); }
      .r { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; min-height: 2.9rem; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
      .r .ic { color: var(--ink-soft); text-align: center; }
      .r small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .r .go { color: var(--ink-soft); font-size: 1.1rem; }
      .more { display: flex; justify-content: center; margin-top: var(--space-3); }
      .more summary { list-style: none; }
      .fold { margin-top: var(--space-3); padding: var(--space-3); border: 1px dashed var(--line); border-radius: 10px; }
      .fold .r:last-child { border-bottom: 0; }
      .danger { color: var(--over); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: var(--text-sm); }
      .acts { display: flex; gap: var(--space-2); justify-content: flex-end; align-items: center; margin-top: var(--space-4); }
      .acts .left { margin-right: auto; }
      .field { margin-top: var(--space-3); }
      .fi { display: flex; align-items: center; min-height: 2.75rem; padding: 0 var(--space-3); border-radius: 8px; background: color-mix(in srgb, var(--line) 45%, var(--paper-raised)); font-size: var(--text-base); color: var(--ink); }
      .fi small { margin-left: auto; color: var(--ink-soft); font-size: var(--text-sm); }
      .kind-now { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
      .lnk { color: var(--pen); text-decoration: underline; text-underline-offset: 3px; font-size: var(--text-sm); font-weight: 500; }
      .addmore { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: var(--space-3); }
      .addmore span { font-size: var(--text-sm); color: var(--ink); display: inline-flex; gap: .3rem; align-items: center; }
      .addmore i { font-style: normal; width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 1.5px dashed var(--ink-soft); display: grid; place-items: center; font-size: .75rem; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
      .marks { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }
      .mark { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .55rem; border: 1px dashed var(--line); border-radius: 999px; font-size: var(--text-xs); color: var(--ink-soft); background: var(--paper); }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Opened: a summary and the next step -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · Stay</p>
            <div class="sheet">
              <div class="head">
                <h3>Hotel Kanra</h3><span class="amt">450 €</span>
                <span class="meta"><i class="cat-dot cat-dot--stay"></i>Where we sleep · 3 nights · everyone</span>
              </div>
              <div class="track"><span class="stp on"><i></i>Chosen</span><span class="stp"><i></i>Booked</span><span class="stp"><i></i>Paid</span></div>
              <div class="next"><button class="button button--primary">Mark it booked</button></div>
              <div class="rows">
                <div class="r"><span class="ic">✎</span><span>Name, day, price<small>Hotel Kanra · 3 nights · 450 €</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">👥</span><span>Who it’s for<small>Everyone, split equally</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">⇄</span><span>Compare the options<small>2 options for “Where we sleep”</small></span><span class="go">›</span></div>
              </div>
              <div class="more"><button class="button button--small">More ▾</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>1 · You open a line: a summary, not a form.</b>
          <ul>
            <li>What it is, its price, and <b>where it stands</b> as a small track (Chosen → Booked → Paid).</li>
            <li><b>One main button: the next step</b> (“Mark it booked”, then “Mark it paid”).</li>
            <li>Three rows to change things, each opening its own short sheet.</li>
            <li>The rare things are in <b>More ▾</b> (2).</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. More -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · Stay</p>
            <div class="sheet">
              <div class="head"><h3>Hotel Kanra</h3><span class="amt">450 €</span></div>
              <div class="fold">
                <div class="r"><span class="ic">📦</span><span>Part of a package<small>no</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">↺</span><span>Back to “To try”<small>for restaurants</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">✕</span><span>Drop it<small>kept for the record, out of the budget</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic"></span><span class="danger">Delete this line</span><span></span></div>
              </div>
              <div class="more"><button class="button button--small">Less ▴</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>2 · More ▾.</b> Package, Back to “To try” (only for restaurants), Drop it and <b>Delete</b> (red, with its confirm), folded away. Nothing else moves.</figcaption>
      </figure>

      <!-- 3. Edit: the basics only, one Save -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Hotel Kanra · change</p>
            <div class="sheet">
              <div class="kind-now"><i class="cat-dot cat-dot--stay"></i><b>Stay</b><span class="lnk" style="margin-left:auto">Change what it is</span></div>
              <div class="field"><p class="field__label">What you’re deciding</p><div class="fi">Where we sleep</div></div>
              <div class="row2 field"><div><p class="field__label">From</p><div class="fi">Day 5</div></div><div><p class="field__label">Until</p><div class="fi">Day 8</div></div></div>
              <div class="field"><p class="field__label">Price</p><div class="fi">450<small>EUR</small></div></div>
              <div class="acts"><button class="button button--quiet">Cancel</button><button class="button button--primary">Save</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>3 · Name, day, price.</b> Only the basics, and <b>one Save</b>.
          <ul>
            <li>“What is it?” shows the current kind; the 5 choices open only if you tap <b>Change what it is</b>.</li>
            <li>No Delete here any more: it’s in More.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. Mark it booked -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Hotel Kanra · booked</p>
            <div class="sheet">
              <h3 class="sheet-title">Mark it booked</h3>
              <div class="field"><p class="field__label">Booked for</p><div class="fi">450<small>EUR</small></div></div>
              <p class="hand" style="margin-top:var(--space-2)">the price you got; change it if it moved</p>
              <div class="addmore"><span><i>+</i>Confirmation number</span><span><i>+</i>Booking link</span><span><i>+</i>Ticket or voucher</span></div>
              <div class="acts"><button class="button button--quiet">Cancel</button><button class="button button--primary">Booked</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>4 · Mark it booked.</b> One amount (already filled), then <b>+ Confirmation number · + Booking link · + Ticket</b> only if you want them: each opens its box when tapped.</figcaption>
      </figure>

      <!-- 5. Booked: what changes -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · Stay</p>
            <div class="sheet">
              <div class="head">
                <h3>Hotel Kanra</h3><span class="amt">450 €</span>
                <span class="meta"><i class="cat-dot cat-dot--stay"></i>Where we sleep · 3 nights · everyone</span>
              </div>
              <div class="track"><span class="stp ok"><i></i>Chosen</span><span class="stp ok"><i></i>Booked</span><span class="stp"><i></i>Paid</span></div>
              <div class="marks"><span class="mark">🎫 #CP-48213</span><span class="mark">📎 1 file</span></div>
              <div class="next"><button class="button button--primary">Mark it paid</button></div>
              <p class="hand" style="text-align:center;margin-top:var(--space-2)">or <span class="lnk" style="font-family:var(--font-text)">pay in parts</span> (deposit, balance…)</p>
              <div class="rows">
                <div class="r"><span class="ic">🎫</span><span>Booking<small>#CP-48213 · booking.com · 1 file</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">✎</span><span>Name, day, price<small>Hotel Kanra · 3 nights · 450 €</small></span><span class="go">›</span></div>
                <div class="r"><span class="ic">👥</span><span>Who it’s for<small>Everyone, split equally</small></span><span class="go">›</span></div>
              </div>
              <div class="more"><button class="button button--small">More ▾</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>5 · Once it’s booked.</b> The track moves on, the booking marks appear, and the next step becomes <b>Mark it paid</b> (or <b>pay in parts</b> for deposits).
          <ul>
            <li>A <b>Booking</b> row appears only now (number, link, files).</li>
            <li>Once paid: who paid and when, in the same place; payments in parts show as a short list.</li>
          </ul>
        </figcaption>
      </figure>

    </div>
  </body>
</html>
