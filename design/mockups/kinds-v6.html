<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questions by kind, ideas, the place card (v6, 16 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: var(--space-4); }
      .kicker { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .sheet { position: relative; margin-top: var(--space-3); padding: var(--space-4); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; }
      .sheet h3 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .kind-now { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); margin-top: var(--space-2); }
      .kind-now .lnk { margin-left: auto; }
      .lnk { color: var(--pen); text-decoration: underline; text-underline-offset: 3px; font-size: var(--text-sm); }
      .field { margin-top: var(--space-3); }
      .fi { display: flex; align-items: center; min-height: 2.75rem; padding: 0 var(--space-3); border-radius: 8px; background: color-mix(in srgb, var(--line) 45%, var(--paper-raised)); font-size: var(--text-base); color: var(--ink); }
      .fi.ph { color: var(--ink-soft); }
      .fi small { margin-left: auto; color: var(--ink-soft); font-size: var(--text-sm); }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
      .row2 .field { margin-top: var(--space-3); }
      .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
      .per { display: flex; gap: 0; margin-top: var(--space-2); }
      .calc { font-size: var(--text-sm); color: var(--ink-soft); margin-top: var(--space-1); }
      .calc b { color: var(--ink); }
      .yn { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3); font-size: var(--text-md); }
      .yn .chips { margin: 0; }
      .acts { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-4); }
      .new { display: inline-block; margin-left: .3rem; padding: 0 .35rem; border-radius: 4px; font-size: .6rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: color-mix(in srgb, var(--estimated) 25%, transparent); color: var(--estimated-text); vertical-align: 2px; }

      /* place card */
      .place { margin-top: var(--space-3); padding: var(--space-4); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; }
      .place h4 { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-title); font-size: var(--text-xl); }
      .place h4 .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--font-text); font-size: var(--text-sm); }
      .place h4 small { font-family: var(--font-text); font-size: var(--text-xs); color: var(--ink-soft); font-weight: 400; }
      .grp { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin-top: var(--space-4); padding-bottom: var(--space-1); border-bottom: 1px solid var(--line); }
      .ln { display: grid; grid-template-columns: .8rem minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); }
      .ln small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .dot { width: .6rem; height: .6rem; border-radius: 50%; }
      .dot--est { background: var(--estimated); }
      .dot--none { border: 1.5px solid var(--ink-soft); }
      .ghost { display: grid; grid-template-columns: .8rem minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-2); margin: var(--space-2) 0; border: 1.5px dashed var(--line); border-radius: 8px; font-size: var(--text-md); color: var(--ink-soft); }
      .ghost b { color: var(--ink); font-weight: 600; }
      .ghost .go { color: var(--ink-soft); }
      .prompts { display: flex; justify-content: space-evenly; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
      .prompts span { display: inline-flex; align-items: center; gap: .3rem; font-size: var(--text-sm); color: var(--ink-soft); }
      .prompts i { font-style: normal; width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: .7rem; }
      .opts { font-size: var(--text-xs); color: var(--pen); }
      .idea { display: grid; grid-template-columns: .8rem minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); }
      .idea small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .day-btn { display: inline-flex; align-items: center; padding: 0 .6rem; min-height: 2rem; border: 1.5px solid var(--ink); border-radius: 6px; font-size: var(--text-xs); font-weight: 600; }
      .filter { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Activity -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · add</p>
            <div class="sheet">
              <h3>Add to Kyoto</h3>
              <div class="kind-now"><i class="cat-dot cat-dot--activity"></i><b>Activity</b><span class="lnk">Change</span></div>
              <div class="field"><p class="field__label">What is it?</p><div class="fi ph">Fushimi Inari at dawn</div></div>
              <div class="row2"><div class="field"><p class="field__label">Day</p><div class="fi">Day 6 ▾</div></div><div class="field"><p class="field__label">Time <span class="field__optional">(optional)</span></p><div class="fi ph">07:00</div></div></div>
              <div class="field"><p class="field__label">Price <span class="new">new</span></p>
                <div class="switch" role="radiogroup"><button role="radio" aria-checked="true">Per person</button><button role="radio" aria-checked="false">For everyone</button></div>
                <div class="fi" style="margin-top:var(--space-2)">25<small>EUR</small></div>
                <p class="calc">× 2 travellers = <b>50 €</b></p></div>
              <div class="yn"><span>Booking needed?</span><span class="chips"><button class="chip" aria-pressed="true">Yes</button><button class="chip">No</button></span></div>
              <div class="field"><p class="field__label">How long <span class="field__optional">(optional)</span></p><div class="fi ph">2 h</div></div>
              <div class="acts"><button class="button button--quiet">Cancel</button><button class="button button--primary">Add</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>1 · An activity.</b> The day and a time; <b>price per person</b> (the app multiplies, and says how much it makes); booking needed (a reminder until it’s booked); how long it takes.</figcaption>
      </figure>

      <!-- 2. Restaurant -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · add</p>
            <div class="sheet">
              <h3>Add to Kyoto</h3>
              <div class="kind-now"><i class="cat-dot cat-dot--restaurant"></i><b>Restaurant</b><span class="lnk">Change</span></div>
              <div class="field"><p class="field__label">Name</p><div class="fi ph">Kikunoi</div></div>
              <div class="field"><p class="field__label">When</p>
                <div class="chips"><button class="chip" aria-pressed="true">No day yet: To try</button><button class="chip">Day 6</button><button class="chip">Day 7 ▾</button></div>
                <div class="chips"><button class="chip">Breakfast</button><button class="chip">Lunch</button><button class="chip" aria-pressed="true">Dinner</button></div></div>
              <div class="field"><p class="field__label">About how much, per person</p><div class="fi">90<small>EUR</small></div><p class="calc">≈ <b>180 €</b> for 2</p></div>
              <div class="yn"><span>Reservation needed?</span><span class="chips"><button class="chip" aria-pressed="true">Yes</button><button class="chip">No</button></span></div>
              <div class="field"><p class="field__label">The kind of food <span class="field__optional">(optional)</span></p><div class="fi ph">kaiseki</div></div>
              <div class="acts"><button class="button button--quiet">Cancel</button><button class="button button--primary">Add</button></div>
            </div>
          </div>
        </div>
        <figcaption><b>2 · A restaurant.</b> A day and a meal — or <b>no day yet: it goes to To try</b>; an estimate <b>per person</b>; reservation needed; the kind of food (shown under the name).</figcaption>
      </figure>

      <!-- 3. Car rental + getting around -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Okinawa · add</p>
            <div class="sheet">
              <h3>Add to Okinawa</h3>
              <div class="kind-now"><i class="cat-dot cat-dot--car_rental"></i><b>Car rental</b><span class="lnk">Change</span></div>
              <div class="field"><p class="field__label">Company <span class="field__optional">(optional)</span></p><div class="fi ph">Times Car Rental</div></div>
              <div class="row2"><div class="field"><p class="field__label">Pick up</p><div class="fi">Day 9 · Naha ▾</div></div><div class="field"><p class="field__label">Drop off</p><div class="fi">Day 12 ▾</div></div></div>
              <div class="field"><p class="field__label">Price for the rental</p><div class="fi">210<small>EUR</small></div><p class="calc">4 days · ≈ 52 € a day</p></div>
              <div class="yn"><span>Insurance included?</span><span class="chips"><button class="chip">Yes</button><button class="chip" aria-pressed="true">No</button></span></div>
              <div class="field"><p class="field__label">Deposit <span class="field__optional">(held, given back)</span></p><div class="fi ph">300</div></div>
              <div class="acts"><button class="button button--quiet">Cancel</button><button class="button button--primary">Add</button></div>
            </div>
            <div class="sheet">
              <div class="kind-now" style="margin-top:0"><i class="cat-dot cat-dot--transport"></i><b>Getting around</b><span class="lnk">Change</span></div>
              <div class="row2"><div class="field"><p class="field__label">From</p><div class="fi ph">Naha</div></div><div class="field"><p class="field__label">To</p><div class="fi ph">Zamami</div></div></div>
              <div class="chips"><button class="chip">Taxi</button><button class="chip">Bus</button><button class="chip" aria-pressed="true">Ferry</button><button class="chip">Train</button></div>
              <div class="field"><p class="field__label">Price · per person</p><div class="fi">18<small>EUR</small></div></div>
            </div>
          </div>
        </div>
        <figcaption><b>3 · A car rental and getting around.</b>
          <ul>
            <li><b>Car:</b> pick-up and drop-off (day, place), the price for the rental (and per day), insurance included, the <b>deposit</b> — held, not counted in the budget.</li>
            <li><b>Getting around:</b> from → to, the mode, per person or for everyone.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. To try with activities -->
      <figure>
        <div class="phone">
          <div class="pad">
            <p class="kicker">Kyoto · 3 nights</p>
            <div class="place">
              <p class="grp" style="margin-top:0;display:flex;justify-content:space-between"><span>To try · 4</span><span class="hand" style="text-transform:none;letter-spacing:0;font-weight:400">no day yet</span></p>
              <div class="filter"><button class="chip" aria-pressed="true">All</button><button class="chip"><i class="cat-dot cat-dot--restaurant"></i>Eat</button><button class="chip"><i class="cat-dot cat-dot--activity"></i>Do</button></div>
              <div class="idea"><i class="cat-dot cat-dot--restaurant"></i><span>Kikunoi<small>kaiseki · ≈ 180 € for 2 · book ahead</small></span><span class="day-btn">Day ▾</span></div>
              <div class="idea"><i class="cat-dot cat-dot--activity"></i><span>Fushimi Inari at dawn<small>free · 2 h</small></span><span class="day-btn">Day ▾</span></div>
              <div class="idea"><i class="cat-dot cat-dot--activity"></i><span>Tea ceremony<small>≈ 50 € · booking needed</small></span><span class="day-btn">Day ▾</span></div>
              <div class="idea"><i class="cat-dot cat-dot--restaurant"></i><span>Nishiki market<small>street food</small></span><span class="day-btn">Day ▾</span></div>
              <p class="hand" style="margin-top:var(--space-2)">pick a day: it moves into that day · “Back to To try” works for both</p>
            </div>
          </div>
        </div>
        <figcaption><b>4 · To try, for restaurants <i>and</i> activities.</b> The list of ideas for a place, before they have a day. Each with its category’s pencil; <b>All · Eat · Do</b> to filter when it gets long. Day ▾ moves it into a day; it can go back.</figcaption>
      </figure>

      <!-- 5. Place card: Where we sleep + day prompts -->
      <figure>
        <div class="phone">
          <div class="pad">
            <div class="place">
              <h4><span class="n">3</span>Okinawa <small>4 nights</small></h4>
              <p class="grp">Stay</p>
              <div class="ghost"><span class="dot dot--none"></span><span><b>Where we sleep</b><br /><small>add a place to stay, or compare a few</small></span><span class="go">›</span></div>
              <p class="grp">Day 9 · Sun 11 Apr</p>
              <div class="ln"><span class="dot dot--est"></span><span>Snorkelling in Zamami<small>Activity</small></span><b>90 €</b></div>
              <div class="prompts"><span><i>+</i>What we do</span><span><i>+</i>Where we eat</span></div>
              <p class="grp">Day 10 · Mon 12 Apr</p>
              <div class="ln"><span class="dot dot--none"></span><span>Where we eat tonight<small class="opts">3 options to compare ›</small></span><b>—</b></div>
              <div class="prompts"><span><i>+</i>What we do</span></div>
              <p class="grp">Day 11 · Tue 13 Apr</p>
              <div class="prompts"><span><i>+</i>What we do</span><span><i>+</i>Where we eat</span></div>
            </div>
          </div>
        </div>
        <figcaption><b>5 · The place card.</b>
          <ul>
            <li><b>Where we sleep</b> is there from the start for every place with nights: a dashed line waiting to be filled (not a real line, so nothing in the budget until you add one).</li>
            <li>Each day shows faint <b>+ What we do · + Where we eat</b>. Tapping one starts a <b>decision</b>: you add the options to compare (“Where we eat tonight · 3 options to compare”), you pick one, it becomes the line.</li>
            <li>Once a day has an activity, “What we do” still shows (you can add more); “Where we eat” hides once a meal is planned.</li>
          </ul>
        </figcaption>
      </figure>

    </div>
  </body>
</html>
