<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Who paid what (v4 look, cards)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v4.js'
    </script>
  </head>
  <body>
    <div class="phones">
      <figure>
        <div class="phone">
          <div class="screen screen--trip">
            <header class="screen__top"><span class="screen__back">‹</span><div class="screen__heading"><h1 class="screen__title screen__title--trip">Colombia &amp; Panama</h1><p class="screen__sub">4 – 18 Sept 2026 · 4 travellers</p></div><span class="avatars"><span class="avatar avatar--me">D</span><span class="avatar">P</span><span class="avatar">D</span><span class="avatar">G</span></span></header>
            <section class="trip-budget"><div class="trip-budget__row"><p class="trip-budget__figure num">2 912 €</p><div class="words-switch"><button><span class="u">your share</span></button><span> · </span><button>total</button></div></div><div class="hand-bar" data-confirmed="0.902" data-estimated="0.098" style="height:16px;margin-top:var(--space-2)"><svg></svg></div><div class="trip-budget__legend num"><span><b class="trip-budget__confirmed-figure">2 627 €</b> confirmed</span><span><b class="trip-budget__estimated-figure">285 €</b> still estimated</span></div></section>
            <div class="cards">
              <section class="sketch-box sketch-box--strong card card--hero" data-seed="80">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <p>You are owed</p><b>133 €</b><span>you paid 2 760 € · your share of it is 2 627 €</span>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="75">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>To settle up<small>2 payments</small></h2></header>
<div class="line line--who"><span class="avatar">D</span><span><span class="line__name">Danielle pays you</span><span class="line__meta">her part of Peggy’s photoshoot</span><span class="small-button">Paid back</span></span><span class="line__amount">67 €</span></div>
<div class="line line--who"><span class="avatar">G</span><span><span class="line__name">Gabriel pays you</span><span class="line__meta">his part of Peggy’s photoshoot</span><span class="small-button">Paid back</span></span><span class="line__amount">67 €</span></div>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="76">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Balances</h2></header>
<div class="line line--who"><span class="avatar avatar--me">D</span><span><span class="line__name">Djamina</span><span class="line__meta">paid 2 760 € · share 2 627 €</span></span><span class="line__amount"><span class="plus">+133 €</span><span class="line__tag line__tag--ok">is owed</span></span></div>
<div class="line line--who"><span class="avatar">D</span><span><span class="line__name">Danielle</span><span class="line__meta">paid 2 560 € · share 2 627 €</span></span><span class="line__amount"><span class="minus">−67 €</span><span class="line__tag line__tag--owe">owes</span></span></div>
<div class="line line--who"><span class="avatar">G</span><span><span class="line__name">Gabriel</span><span class="line__meta">paid 2 560 € · share 2 627 €</span></span><span class="line__amount"><span class="minus">−67 €</span><span class="line__tag line__tag--owe">owes</span></span></div>
<div class="line line--who"><span class="avatar">P</span><span><span class="line__name">Peggy</span><span class="line__meta">paid 2 560 € · share 2 560 €</span></span><span class="line__amount">0 €<span class="line__tag line__tag--ok">settled</span></span></div>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="77">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Paid so far</h2><b>10 440 €</b></header>
<div class="line"><span><span class="line__name">Agency package</span><span class="line__meta">each paid their own share · 2 560 € each</span></span><span class="line__amount">10 240 €</span></div>
<div class="line"><span><span class="line__name">Peggy’s photoshoot</span><span class="line__meta">paid by you on 1 Sept · a gift, split between 3 · 230 $</span></span><span class="line__amount">200 €</span></div>
              </section>
              <section class="sketch-box sketch-box--light card " data-seed="78">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Paid back</h2></header>
<p class="card__note">nothing yet</p>
<button class="add-row" type="button" style="margin-top: var(--space-2)"><span class="add-row__plus">+</span>Record a repayment</button>
              </section>
              <section class="sketch-box sketch-box--light card card--plain" data-seed="79" data-dashed="1">
                <svg class="sketch-box__line" aria-hidden="true"></svg>
                <header class="card__head"><h2>Booked, not paid yet<small>not in the balances</small></h2></header>
<p class="card__note">nothing: everything booked is paid</p>
              </section>
            </div>
            <nav class="trip-nav"><a><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"></path></svg>Trip</a><a><svg viewBox="0 0 24 24"><rect x="4" y="5" width="6" height="14" rx="1.5"></rect><rect x="14" y="5" width="6" height="14" rx="1.5"></rect></svg>Compare</a><a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v8l6 5"></path></svg>Budget</a><a class="active"><svg viewBox="0 0 24 24"><path d="M4 9h14l-3-3M20 15H6l3 3"></path></svg>Who paid</a></nav>
          </div>
        </div>
        <figcaption><b>Who paid · one card per section.</b> The answer first, on its own card (“You are owed 133 €”). <b>New: “each paid their own share”</b> as a payer, for the package: it counts as paid but creates no debts, so only the photoshoot is left to settle. “Booked, not paid yet” is dashed: not money yet.</figcaption>
      </figure>
    </div>
  </body>
</html>
