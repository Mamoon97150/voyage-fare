<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — AI reading (build 8 step 5, v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: var(--space-4); }
      .top { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-6) var(--space-4) var(--space-2); }
      .top .back { font-size: 1.6rem; color: var(--ink); }
      .top h1 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; line-height: 1.15; }
      .top .sub { font-family: var(--font-hand); font-size: var(--text-note-l); color: var(--ink-soft); }
      .grow { flex: 1; min-width: 0; }
      .ghost { opacity: .35; }
      .kicker { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .box { padding: var(--space-6) var(--space-4) var(--space-4); }
      .box h3 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; margin-top: var(--space-1); }
      .lead { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.45; margin-top: var(--space-1); }
      .paste-box { margin-top: var(--space-3); min-height: 6.5rem; border: 1.5px dashed var(--line); border-radius: 10px; padding: var(--space-2) var(--space-3); font-size: .72rem; color: var(--ink-soft); line-height: 1.5; position: relative; background: var(--paper-raised); white-space: pre-wrap; overflow: hidden; max-height: 8rem; }
      .paste-box .ph { font-size: var(--text-sm); }
      .paste-btn { position: absolute; right: var(--space-2); bottom: var(--space-2); display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .75rem; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-raised); font-size: var(--text-xs); font-weight: 600; color: var(--ink); }
      .acts { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-4); }
      .notes { margin-top: var(--space-3); display: grid; gap: var(--space-2); }
      .note { display: flex; gap: var(--space-2); align-items: baseline; padding: var(--space-2) var(--space-3); background: var(--paper-note); border: 1.5px dashed var(--ink-soft); border-radius: 10px; font-size: var(--text-sm); line-height: 1.45; }
      .note i { font-style: normal; flex: none; display: inline-grid; place-items: center; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: .65rem; font-weight: 700; }
      .note--ok i { background: var(--confirmed); }
      .who { font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.45; margin-top: var(--space-2); }
      .who b { color: var(--ink); }

      /* reading */
      .reading { display: grid; place-items: center; gap: var(--space-3); padding: var(--space-8, 3rem) var(--space-4); text-align: center; }
      .pencil { font-size: 2.2rem; animation: wob 1.2s ease-in-out infinite; }
      @keyframes wob { 0%,100% { transform: rotate(-8deg) translateX(-6px); } 50% { transform: rotate(6deg) translateX(6px); } }
      .scribble { width: 9rem; height: .6rem; border-bottom: 2px dashed var(--ink-soft); }

      /* preview rows */
      .cover { padding: var(--space-6) var(--space-4) var(--space-4); }
      .cover h3 { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; margin-top: var(--space-1); }
      .cover p { font-size: var(--text-sm); color: var(--ink-soft); margin-top: 2px; }
      .read-by { display: inline-flex; align-items: center; gap: .3rem; margin-top: var(--space-2); padding: .1rem .55rem; border: 1px dashed var(--ink-soft); border-radius: 999px; font-size: var(--text-xs); color: var(--ink-soft); }
      .place { margin-top: var(--space-4); }
      .place h4 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
      .place h4 small { font-size: var(--text-xs); color: var(--ink-soft); font-weight: 400; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
      .row .w { font-size: var(--text-2xs); color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
      .row .p { text-align: right; font-weight: 600; white-space: nowrap; }
      .row .o { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--ink-soft); }
      .dash { color: var(--ink-soft); font-weight: 400; }
      .sticky { position: sticky; bottom: 0; background: var(--paper); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); display: grid; gap: var(--space-2); }

      /* booking email */
      .found { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
      .found li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
      .found li span:first-child { color: var(--ink-soft); font-size: var(--text-xs); }
      .found .was { color: var(--ink-soft); text-decoration: line-through; margin-right: .35rem; font-weight: 400; }
      .match { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-2); margin-top: var(--space-3); padding: var(--space-3); border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper-raised); }
      .match b { display: block; font-size: var(--text-md); }
      .match small { font-size: var(--text-xs); color: var(--ink-soft); }
      .change { font-size: var(--text-xs); font-weight: 600; text-decoration: underline; color: var(--ink); white-space: nowrap; }
      .st { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--confirmed); }

      /* menu */
      .menu { list-style: none; margin: 0; padding: 0; }
      .menu li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); font-size: var(--text-md); }
      .menu li .ic { width: 1.6rem; text-align: center; }
      .menu li small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .menu li.new { font-weight: 600; }
      .sheet { padding: var(--space-6) var(--space-4) var(--space-4); margin: var(--space-3); }

      /* admin meter */
      .meter { margin-top: var(--space-3); }
      .meter .bar { height: .55rem; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper-raised); }
      .meter .bar span { display: block; height: 100%; background: var(--ink); }
      .meter p { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--ink-soft); margin-top: var(--space-1); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-3); font-size: var(--text-sm); }
      .stats b { display: block; font-family: var(--font-title); font-size: var(--text-xl); }
      .ai-switch { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--line); font-size: var(--text-sm); }
      .ai-toggle { width: 2.6rem; height: 1.5rem; border-radius: 999px; background: var(--ink); position: relative; }
      .ai-toggle::after { content: ''; position: absolute; right: .2rem; top: .2rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--paper); }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Not in our format → read it for me -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Bring it from my AI</h1><p class="sub">two steps, then a preview</p></div></div>
          <div class="pad">
            <div class="paste-box" style="margin-top:0">Here's a lovely 10-day plan for Japan! 🌸

Days 1–4: Tokyo. Stay at Hotel Gracery Shinjuku (~160€/night). Day 2, teamLab Planets (32€ pp). Day 3, a day trip to Nikko.
Days 5–7: Kyoto, ryokan Yachiyo (780€ for 3 nights) or Hotel Kanra (450€)… Try Kikunoi for kaiseki!</div>
            <div class="sketch-box sketch-box--strong box" data-seed="81" style="margin-top:var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">Not in our format</p>
              <h3>Your AI answered in its own words</h3>
              <p class="lead">Voyage Fare can read it for you and turn it into lines. You check everything in the preview before anything is saved.</p>
              <a class="button button--primary button--wide" style="margin-top:var(--space-3)">✎ Read it for me</a>
              <p class="who">Your text is sent to <b>Claude</b> (Anthropic) to be read, then forgotten: it isn’t kept or used to train anything.</p>
              <a class="button button--quiet button--wide" style="margin-top:var(--space-3)">or copy the request again</a>
            </div>
          </div>
        </div>
        <figcaption><b>1 · When it isn’t in our format.</b> Today this is a dead end (“We couldn’t find the trip”). Now:
          <ul>
            <li><b>Read it for me</b>: the AI turns the text into our format.</li>
            <li>A clear line on <b>where the text goes</b> (Claude, Anthropic) and that it isn’t kept.</li>
            <li>The strict format still works <b>without AI</b>: when it’s in our format, nothing is sent anywhere.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. Reading, then the same preview -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>What your AI gave</h1><p class="sub">check, then create it</p></div></div>
          <div class="pad" style="padding-bottom:0">
            <div class="sketch-box sketch-box--strong cover" data-seed="82">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">A new trip</p>
              <h3>Japan</h3>
              <p>10 days · no dates yet · just you</p>
              <span class="read-by">✎ read by AI · check the prices</span>
            </div>
            <div class="place"><h4>1. Tokyo <small>4 nights</small></h4>
              <div class="row"><span><span class="w">Stay</span><br />Hotel Gracery Shinjuku</span><span class="p">≈ 640 €</span><span class="o">4 nights × 160 €</span></div>
              <div class="row"><span><span class="w">Day 2</span><br />teamLab Planets</span><span class="p">32 €</span></div>
              <div class="row"><span><span class="w">Day 3</span><br />Day trip to Nikko</span><span class="p"><span class="dash">—</span></span></div>
            </div>
            <div class="place"><h4>2. Kyoto <small>3 nights</small></h4>
              <div class="row"><span><span class="w">Stay</span><br />Ryokan or hotel?</span><span class="p">from 450 €</span><span class="o">2 options: Ryokan Yachiyo 780 € · Hotel Kanra 450 €</span></div>
              <div class="row"><span><span class="w">To try</span><br />Kikunoi</span><span class="p"><span class="dash">—</span></span><span class="o">kaiseki</span></div>
            </div>
            <div class="notes">
              <div class="note"><i>!</i><span>“~160 €” was written as <b>about</b>: kept as an estimate. No price was guessed.</span></div>
            </div>
          </div>
          <div class="sticky"><a class="button button--primary button--wide">Create the trip</a><a class="button button--quiet button--wide">Back to the text</a></div>
        </div>
        <figcaption><b>2 · Then the same preview as today.</b> A few seconds of “reading your text…” (a pencil scribbling), then the preview you know:
          <ul>
            <li>A small mark on the cover: <b>read by AI · check the prices</b>.</li>
            <li>Same rules as the request: <b>never guess a price</b>, keep all the options, nothing arrives as booked.</li>
            <li>Works the same inside a trip (⋯ → Import from my AI): only what’s new.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 3. Paste a booking email: where -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="ghost pad"><p class="kicker">Cartagena</p><p style="font-family:var(--font-title);font-size:var(--text-xl)">Colombia in September</p></div>
          <div class="sketch-box sketch-box--strong sheet" data-seed="83">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <ul class="menu">
              <li class="new"><span class="ic">✉</span><span>Paste a booking email<small>it finds the line and marks it booked</small></span></li>
              <li><span class="ic">⧉</span><span>Copy the trip for my AI</span></li>
              <li><span class="ic">⇣</span><span>Import from my AI</span></li>
              <li><span class="ic">⎘</span><span>Start a new trip from this one</span></li>
              <li><span class="ic">⚙</span><span>Trip settings</span></li>
            </ul>
          </div>
          <div class="pad" style="padding-top:0">
            <div class="sketch-box sketch-box--light box" data-seed="84">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <h3 style="margin-top:0">Paste a booking email</h3>
              <p class="lead">The confirmation you got from the hotel, the airline, Booking… Open it, select all, copy, paste here.</p>
              <div class="paste-box"><span class="ph">Paste the email…</span><span class="paste-btn">📋 Paste</span></div>
              <p class="who">Sent to <b>Claude</b> (Anthropic) to be read, not kept.</p>
              <div class="acts"><a class="button button--quiet">Cancel</a><a class="button button--primary">Read it</a></div>
            </div>
          </div>
        </div>
        <figcaption><b>3 · Paste a booking email.</b> First in the trip menu (it applies to the whole trip).
          <ul>
            <li>Paste the whole email: the AI picks out <b>what was booked, the price, the dates and the confirmation number</b>.</li>
            <li>Also on a line, in “Where it stands”: <b>📋 from the email</b> fills the boxes for that line only.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 4. What it found -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>From the email</h1><p class="sub">check, then save</p></div></div>
          <div class="pad">
            <div class="sketch-box sketch-box--strong box" data-seed="85">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">It goes on this line</p>
              <div class="match"><span><b>Hotel Casona del Porvenir</b><small>Cartagena · Stay · was chosen</small></span><a class="change">Not this one</a></div>
              <ul class="found">
                <li><span>Status</span><b class="st">Booked</b></li>
                <li><span>Price</span><b><span class="was">1 200 €</span>1 140 €</b></li>
                <li><span>Dates</span><b>12 – 17 Sept · 5 nights</b></li>
                <li><span>Confirmation</span><b>CP-48213</b></li>
                <li><span>Booking link</span><b style="font-weight:400;color:var(--ink-soft)">booking.com/…</b></li>
              </ul>
              <div class="notes">
                <div class="note"><i>!</i><span>The price was <b>1 200 €</b> (estimated). The email says <b>1 140 €</b>: it takes the email’s.</span></div>
              </div>
              <div class="acts"><a class="button button--quiet">Cancel</a><a class="button button--primary">Mark it booked</a></div>
            </div>
            <div class="sketch-box sketch-box--light box" data-seed="86" style="margin-top:var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <p class="kicker">When nothing matches</p>
              <p class="lead" style="margin-top:var(--space-1)">“Tuk-tuk tour, Resmont Travel, 57 €” isn’t in the trip yet.</p>
              <a class="button button--quiet button--wide" style="margin-top:var(--space-3)">Add it as a new line, booked</a>
            </div>
          </div>
        </div>
        <figcaption><b>4 · What it found.</b> One screen, before anything is saved:
          <ul>
            <li><b>Which line</b> it goes on (matched by name and place), with <b>Not this one</b> to pick another.</li>
            <li>What changes: status, <b>price</b> (old one crossed out), dates, confirmation number, link.</li>
            <li>Nothing matches? <b>Add it as a new line</b>, already booked.</li>
            <li>Different dates from the trip? A note, nothing moved by itself.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 5. Paused + no connection -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Bring it from my AI</h1></div></div>
          <div class="pad">
            <p class="form-message" role="status"><b>AI reading is paused this month.</b> It’s free, so it has a small monthly limit for everyone. It’s back on 1 December.</p>
            <div class="sketch-box sketch-box--light box" data-seed="87" style="margin-top:var(--space-4)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <b>Meanwhile, this always works</b>
              <p class="lead">Ask your AI to write it in our format: copy the request, send it, paste its answer.</p>
              <a class="button button--quiet button--wide" style="margin-top:var(--space-3)">Copy the request</a>
            </div>
            <p class="form-message form-message--error" role="alert" style="margin-top:var(--space-4)">This text is too long to read (about 40 pages). Paste only the part with the trip.</p>
          </div>
        </div>
        <figcaption><b>5 · The limits, said plainly.</b>
          <ul>
            <li>A <b>monthly cap for everyone</b> (about 5 €). Past it: “AI reading is paused this month”, back on the 1st. The format request still works.</li>
            <li>Very long text (over ~30 pages) is refused, not cut.</li>
            <li>Also a small cap per person (e.g. 20 readings a day), so one account can’t use the whole month.</li>
          </ul>
        </figcaption>
      </figure>


      <!-- 7. The trip address (5b) -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Trip settings</h1><p class="sub">Colombia in September</p></div></div>
          <div class="pad">
            <div class="sketch-box sketch-box--strong box" data-seed="89">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">The trip’s email address</p>
              <h3>Forward your bookings here</h3>
              <div class="match" style="margin-top:var(--space-3)"><span><b style="font-size:var(--text-sm);word-break:break-all">colombia-k7q2@trips.voyagefare.app</b></span><span class="small-btn" style="display:inline-flex;align-items:center;min-height:2.2rem;padding:0 .8rem;border:1.5px solid var(--ink);border-radius:999px;font-size:var(--text-xs);font-weight:600">Copy</span></div>
              <ol style="margin:var(--space-3) 0 0 1.1rem;font-size:var(--text-sm);line-height:1.55;color:var(--ink-soft)">
                <li>Open the confirmation email (hotel, airline, Booking…).</li>
                <li><b style="color:var(--ink)">Forward</b> it to this address.</li>
                <li>It shows up in <b style="color:var(--ink)">To review</b> at the top of the trip.</li>
              </ol>
              <p class="who">Only emails <b>from the travellers’ addresses</b> (Ana, Bea, you) are read. Others are ignored. Each one is read by <b>Claude</b> (Anthropic), not kept.</p>
              <a class="button button--quiet button--wide" style="margin-top:var(--space-3)">Get a new address</a>
              <p class="hand" style="margin-top:var(--space-2)">the old one stops working (if it leaked)</p>
            </div>
          </div>
        </div>
        <figcaption><b>7 · The trip’s address (5b).</b> In Trip settings, one address per trip, with <b>Copy</b> and three short steps.
          <ul>
            <li>Only emails sent <b>from a traveller’s own address</b> are read: a stranger can’t fill your trip or use the AI budget.</li>
            <li><b>Get a new address</b> if it leaked: the old one stops.</li>
            <li>Also a line in the trip menu: “✉ Forward a booking” opens this.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 8. To review on the trip -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="pad">
            <p class="kicker">Colombia in September</p>
            <div class="sketch-box sketch-box--strong box" data-seed="90" style="margin-top:var(--space-3)">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">To review · 2</p>
              <div class="match"><span><b>Hotel Casona del Porvenir</b><small>forwarded by Bea · today · Booked · 1 140 € · #CP-48213</small></span><a class="change">Check</a></div>
              <div class="match"><span><b>Avianca BOG → CTG</b><small>forwarded by you · yesterday · not in the trip yet</small></span><a class="change">Check</a></div>
              <p class="hand" style="margin-top:var(--space-2)">nothing goes in until someone checks it</p>
            </div>
            <div class="ghost" style="margin-top:var(--space-4)"><p class="kicker">Cartagena · Stay</p><div class="row"><span><b>Hotel Casona del Porvenir</b><br /><span style="font-size:var(--text-xs)">chosen</span></span><span class="p">1 200 €</span></div></div>
          </div>
        </div>
        <figcaption><b>8 · To review, at the top of the trip.</b> Every forwarded email waits here, for everyone on the trip.
          <ul>
            <li>One line each: what it is, who forwarded it, what it found.</li>
            <li><b>Check</b> opens the “From the email” screen (4): mark the line booked, or add it as a new line. Or <b>Not for this trip</b> to drop it.</li>
            <li>Not a booking, or it couldn’t be read? It says so here; nothing is lost.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 6. Admin -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="top"><a class="back">‹</a><div class="grow"><h1>Admin</h1><p class="sub">overview</p></div></div>
          <div class="pad">
            <div class="sketch-box sketch-box--strong box" data-seed="88">
              <svg class="sketch-box__line" aria-hidden="true"></svg>
              <span class="tape tape--mustard" aria-hidden="true"></span>
              <p class="kicker">AI reading · November</p>
              <div class="meter"><div class="bar"><span style="width:25%"></span></div><p><span>1,24 € used</span><span>of 5 €</span></p></div>
