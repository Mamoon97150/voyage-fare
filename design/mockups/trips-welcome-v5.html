    <style>
      .phone { padding: 0 0 var(--space-6); }
      .app-header { padding: var(--space-4) var(--space-4) var(--space-3); }
      .app-header img { flex: none; }
      .app-header__account a { font-weight: 600; color: var(--ink); }
      .avatar { display: inline-grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 600; }
      .avatar--me { box-shadow: 0 0 0 2px var(--estimated); }
      .avatars { display: inline-flex; min-height: 0; }
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .u__line { color: var(--estimated); height: 10px; bottom: -0.55em; }
      .u--blue .u__line { color: var(--chosen); }

      /* ── Your trips ── */
      .trips-top { padding: var(--space-4) var(--space-4) var(--space-2); }
      .trips-top h1 { font-family: var(--font-title); font-size: var(--text-3xl); font-weight: 600; line-height: 1.1; }
      .trips-top .hand { font-size: 1.3rem; margin-top: 0.15rem; }
      .shelf { padding: 0 var(--space-3); display: flex; flex-direction: column; gap: var(--space-4); }
      .shelf-label { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: var(--space-4) var(--space-1) calc(-1 * var(--space-2)); display: flex; justify-content: space-between; }
      .shelf-label span { text-transform: none; letter-spacing: 0; font-weight: 500; }

      .next { padding: var(--space-6) var(--space-4) var(--space-4); }
      .next .kicker { display: flex; align-items: center; justify-content: space-between; }
      .countdown { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--estimated-text); }
      .countdown--now { color: var(--confirmed); }
      .next h2 { font-family: var(--font-title); font-size: 1.65rem; font-weight: 600; line-height: 1.1; margin-top: var(--space-2); }
      .next .dates { font-size: var(--text-sm); color: var(--ink-soft); margin-top: 0.2rem; }
      .route { display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem 0.4rem; margin-top: var(--space-3); font-size: var(--text-md); }
      .route i { font-style: normal; color: var(--ink-soft); }
      .route .home { color: var(--ink-soft); font-size: var(--text-sm); }
      .route .today { font-weight: 700; color: var(--confirmed); }
      .money { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px dashed var(--line); }
      .money__row { display: flex; align-items: baseline; justify-content: space-between; }
      .money__fig { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; font-variant-numeric: tabular-nums; }
      .money__words { font-size: var(--text-md); }
      .money .hand-bar { height: 14px; margin-top: var(--space-2); }
      .money__legend { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--ink-soft); margin-top: 0.3rem; font-variant-numeric: tabular-nums; }
      .money__legend b { color: var(--confirmed); }
      .money__legend b.est { color: var(--estimated-text); }
      .todo { margin-top: var(--space-3); display: flex; flex-direction: column; gap: 0.3rem; font-size: var(--text-sm); }
      .todo p { display: flex; align-items: baseline; }
      .todo .dot-todo { flex: none; }
      .dot-ok { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--confirmed); margin-right: 0.35rem; flex: none; }
      .next__foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-4); }
      .open { font-size: var(--text-md); font-weight: 600; color: var(--confirmed); }

      .small-trip { padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--space-3); align-items: center; }
      .small-trip b { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .small-trip .meta { display: block; font-size: var(--text-sm); color: var(--ink-soft); margin-top: 0.1rem; }
      .small-trip .hand { font-size: 1.15rem; display: block; }
      .small-trip .side { text-align: right; font-size: var(--text-sm); }
      .small-trip .side b { font-family: var(--font-text); font-size: var(--text-base); font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
      .small-trip .hand-bar--mini { grid-column: 1 / -1; max-width: none; margin-top: var(--space-2); }
      .tag-ok { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--confirmed); }
      .new-page { padding: var(--space-4); text-align: center; color: var(--ink-soft); }
      .new-page b { color: var(--ink); font-weight: 600; }
      .new-page .hand { font-size: 1.15rem; }
      .past { opacity: .92; }

      /* ── Welcome ── */
      .w-hero { padding: var(--space-2) var(--space-4) 0; text-align: center; }
      .w-hero img { mix-blend-mode: multiply; width: 100%; max-width: 19rem; display: block; margin: 0 auto -0.5rem; }
      .w-hero h1 { font-family: var(--font-title); font-size: 1.9rem; font-weight: 600; line-height: 1.15; text-wrap: balance; }
      .w-hero .lede { font-size: var(--text-body); color: var(--ink-soft); line-height: 1.5; margin-top: var(--space-3); }
      .w-actions { display: flex; flex-direction: column; gap: var(--space-2); margin: var(--space-6) 0 0; }
      .w-actions .button { width: 100%; }
      .w-actions .hand { font-size: 1.15rem; margin-top: 0.1rem; }
      .w-sample { margin: var(--space-8) var(--space-3) 0; padding: var(--space-6) var(--space-4) var(--space-4); }
      .w-sample .sample-label { text-align: center; font-family: var(--font-hand); font-size: 1.2rem; color: var(--ink-soft); margin-bottom: var(--space-2); }
      .w-section { padding: var(--space-6) var(--space-4) 0; }
      .w-section h2 { font-family: var(--font-title); font-size: var(--text-2xl); font-weight: 600; line-height: 1.15; }
      .w-section > .hand { font-size: 1.25rem; }
      .step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0 var(--space-3); margin-top: var(--space-6); }
      .step__n { font-family: var(--font-hand); font-size: 1.9rem; line-height: 1; color: var(--estimated-text); text-align: center; }
      .step h3 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .step p { font-size: var(--text-md); color: var(--ink-soft); line-height: 1.45; margin-top: 0.15rem; }
      .mini { margin-top: var(--space-3); padding: var(--space-2) var(--space-3); }
      .opt-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 var(--space-2); align-items: center; padding: 0.45rem 0; font-size: var(--text-md); }
      .opt-line + .opt-line { border-top: 1px solid var(--line); }
      .pick { width: 1.1rem; height: 1.1rem; border: 1.5px solid var(--ink-soft); border-radius: var(--radius-pen); display: grid; place-items: center; font-size: .7rem; color: var(--paper); }
      .pick--on { background: var(--chosen); border-color: var(--chosen); }
      .opt-line .u { margin-bottom: 0.35rem; }
      .opt-line small { display: block; font-size: var(--text-xs); color: var(--ink-soft); }
      .opt-line .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
      .opt-line .amt small { font-weight: 600; font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; color: var(--confirmed); }
      .people { display: flex; justify-content: space-between; gap: var(--space-2); padding: var(--space-1) 0; }
      .people > span { flex: 1; text-align: center; font-size: var(--text-xs); color: var(--ink-soft); }
      .people b { display: block; white-space: nowrap; font-size: var(--text-md); color: var(--ink); font-variant-numeric: tabular-nums; }
      .people .avatar { width: 1.6rem; height: 1.6rem; font-size: .7rem; margin-bottom: .2rem; }
      .owe { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); padding: 0.3rem 0; }
      .owe b { margin-left: auto; font-variant-numeric: tabular-nums; }
      .owe .avatar { width: 1.6rem; height: 1.6rem; font-size: .7rem; }
      .facts { margin: var(--space-6) var(--space-4) 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
      .facts p { font-size: var(--text-sm); color: var(--ink-soft); line-height: 1.4; }
      .facts b { display: block; color: var(--ink); font-size: var(--text-md); }
      .w-end { margin: var(--space-8) var(--space-4) 0; text-align: center; }
      .w-end .button { width: 100%; }
      .w-foot { margin: var(--space-8) var(--space-4) 0; padding-top: var(--space-3); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-xs); color: var(--ink-soft); }
      .w-foot a { white-space: nowrap; color: var(--confirmed); font-weight: 600; }
      .new { display: inline-block; margin-left: .3rem; padding: 0 .35rem; border-radius: 4px; background: var(--wash-confirmed); color: var(--confirmed); font-size: var(--text-2xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; }
      figcaption ul { margin: var(--space-2) 0 0 1rem; }
      figcaption li { margin-top: 0.25rem; }
    </style>
  </head>

            <li><b>Grouped:</b> Coming up · Still a dream (no dates yet) · Past trips. Colombia &amp; Panama is already a past trip today.</li>
            <li><b>Past trips</b> say what it cost you and whether everyone is settled up.</li>
            <li>A hand note at the top (“148 days to Lisbon”) and <b>+ A new trip</b> as a blank dashed page at the end, instead of the black button.</li>
          </ul>

        <div class="phone">
          <header class="app-header"><img src="/illustrations/compass.svg" width="28" height="28" alt="" /><span class="app-header__name">Voyage Fare</span><span class="app-header__account"><span class="avatar avatar--me" style="width:2rem;height:2rem;font-size:.8rem">D</span></span></header>

          <section class="w-hero">
