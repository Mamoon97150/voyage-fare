<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — Booking details on a line (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .pad { padding: var(--space-4); }
      .kicker { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
      .row b { font-size: var(--text-md); }
      .row .meta { font-size: var(--text-xs); color: var(--ink-soft); }
      .row .amt { font-weight: 600; text-align: right; }
      .row .st { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--confirmed); text-align: right; }
      .marks { grid-column: 1 / -1; display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: 2px; }
      .mark { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .5rem; border: 1px dashed var(--line); border-radius: 999px; font-size: var(--text-xs); color: var(--ink-soft); background: var(--paper-raised); }
      .ghost { opacity: .35; }
      .sheet { padding: var(--space-6) var(--space-4) var(--space-4); margin: var(--space-3); }
      .sheet h3 { font-family: var(--font-title); font-size: var(--text-lg); font-weight: 600; }
      .sheet .sub { font-size: var(--text-sm); color: var(--ink-soft); }
      .steps-row { display: flex; gap: var(--space-2); margin: var(--space-3) 0; }
      .steps-row .chip { flex: 1; justify-content: center; }
      .field { margin-top: var(--space-3); }
      .with { display: flex; gap: var(--space-2); align-items: center; }
      .with .field__input { flex: 1; min-width: 0; }
      .small-btn { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.5rem; padding: 0 .8rem; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-raised); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; color: var(--ink); }
      .later { font-family: var(--font-hand); font-size: var(--text-note); color: var(--ink-soft); margin-top: var(--space-2); }
      .files { list-style: none; margin: var(--space-2) 0 0; padding: 0; }
      .files li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
      .thumb { width: 2.2rem; height: 2.6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); display: grid; place-items: center; font-size: .6rem; font-weight: 700; color: var(--ink-soft); box-shadow: var(--shadow-1); transform: rotate(-2deg); }
      .files b { display: block; font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .files small { font-size: var(--text-xs); color: var(--ink-soft); }
      .files .x { color: var(--ink-soft); font-size: var(--text-sm); }
      .add-file { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin-top: var(--space-3); min-height: 3rem; border: 1.5px dashed var(--ink-soft); border-radius: 10px; font-size: var(--text-sm); font-weight: 600; color: var(--ink); }
      .private { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--ink-soft); }
      .acts { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-4); }
      .label { margin-top: var(--space-4); }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. On the trip page -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="pad">
            <p class="kicker">Cartagena · Stay</p>
            <div class="row">
              <span><b>Hotel Casona del Porvenir</b><br /><span class="meta">12 – 17 Sept · 5 nights</span></span>
              <span><span class="amt">1 140 €</span><br /><span class="st">Booked</span></span>
              <span class="marks"><span class="mark">🎫 #CP-48213</span><span class="mark">📎 2 files</span></span>
            </div>
            <p class="kicker" style="margin-top:var(--space-4)">Day 11</p>
            <div class="row">
              <span><b>Fly Dress Colombia</b><br /><span class="meta">Cleo’s photoshoot</span></span>
              <span><span class="amt">208 €</span><br /><span class="st">Paid</span></span>
              <span class="marks"><span class="mark">🎫 #FD-2291</span><span class="mark">↗ booking</span></span>
            </div>
            <div class="row ghost">
              <span><b>Tuk-tuk tour</b><br /><span class="meta">Resmont Travel</span></span>
              <span><span class="amt">57 €</span><br /><span class="st">Paid</span></span>
            </div>
          </div>
        </div>
        <figcaption><b>1 · On the trip page.</b> A booked or paid line with details shows small marks under it: the <b>confirmation number</b>, <b>📎 files</b>, or <b>↗</b> the booking link. Nothing shows when there’s nothing to show.</figcaption>
      </figure>

      <!-- 2. Marking it booked -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="sketch-box sketch-box--strong sheet" data-seed="71">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h3>Where it stands</h3>
            <p class="sub">Hotel Casona del Porvenir · 1 140 €</p>
            <div class="steps-row"><button class="chip">Chosen</button><button class="chip" aria-pressed="true">Booked</button><button class="chip">Paid</button></div>
            <div class="field"><label class="field__label">Confirmation number <span class="field__optional">(optional)</span></label><div class="field__input" style="display:flex;align-items:center">CP-48213</div></div>
            <div class="field"><label class="field__label">Booking link <span class="field__optional">(optional)</span></label><div class="field__input" style="display:flex;align-items:center;color:var(--ink-soft)">booking.com/…</div></div>
            <p class="later">tickets and vouchers: add them on the line, now or later</p>
            <div class="acts"><a class="button button--quiet">Cancel</a><a class="button button--primary">Save</a></div>
          </div>
        </div>
        <figcaption><b>2 · Marking it booked.</b> When you choose <b>Booked</b> (or Paid), two optional boxes appear: the <b>confirmation number</b> and the <b>booking link</b>. Nothing is required: it’s still one tap to say it’s booked.</figcaption>
      </figure>

      <!-- 3. On the line -->
      <figure>
        <div class="phone" style="padding-bottom:0">
          <div class="sketch-box sketch-box--light sheet" data-seed="72">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <h3>Booking</h3>
            <p class="sub">Hotel Casona del Porvenir</p>
            <div class="field label"><label class="field__label">Confirmation number</label>
              <div class="with"><div class="field__input" style="display:flex;align-items:center">CP-48213</div><span class="small-btn">Copy</span></div></div>
            <div class="field"><label class="field__label">Booking link</label>
              <div class="with"><div class="field__input" style="display:flex;align-items:center;color:var(--ink-soft)">booking.com/hotel/co/casona…</div><span class="small-btn">Open ↗</span></div></div>
            <p class="field__label label">Tickets &amp; vouchers</p>
            <ul class="files">
              <li><span class="thumb">PDF</span><span><b>Booking confirmation.pdf</b><small>212 KB · added by Bea</small></span><span class="x">✕</span></li>
              <li><span class="thumb">IMG</span><span><b>Check-in QR.jpg</b><small>1.4 MB · added by you</small></span><span class="x">✕</span></li>
            </ul>
            <div class="add-file">＋ Add a ticket or voucher</div>
            <p class="private">PDF or photo, up to 10 MB. Only the travellers on this trip can open them.</p>
          </div>
        </div>
        <figcaption><b>3 · On the line</b> (when you open it): a <b>Booking</b> part with the confirmation number (<b>Copy</b>, for the check-in desk), the link (<b>Open ↗</b>), and the <b>files</b>: tickets, vouchers, a QR code photo. Tap a file to open it; ✕ removes it (with a confirm). Who added it is shown. Private to the trip.</figcaption>
      </figure>

    </div>
  </body>
</html>
