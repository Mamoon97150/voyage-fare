<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — The demo trip (v5 look, 15 Nov)</title>
    <script type="module">
      import '/src/index.css'
      import './forms.css'
      import './v4.css'
      import './v5.js'
    </script>
    <style>
      .phone { padding: 0 0 var(--space-6); }
      .hand { font-family: var(--font-hand); color: var(--ink-soft); line-height: 1.2; }
      .avatar { display: inline-grid; place-items: center; border-radius: 50%; background: var(--line); color: var(--ink); font-weight: 600; width: 1.75rem; height: 1.75rem; font-size: .7rem; }
      .avatar--me { box-shadow: 0 0 0 2px var(--estimated); background: var(--ink); color: var(--paper); }
      .avatars { display: inline-flex; gap: 0; }
      .avatars .avatar { margin-left: -.45rem; border: 2px solid var(--paper); }
      .avatars .avatar:first-child { margin-left: 0; }
      .u__line { color: var(--estimated); height: 10px; bottom: -0.55em; }

      .top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-2); }
      .top .back { font-size: 1.4rem; color: var(--ink-soft); }
      .top h1 { flex: 1; font-family: var(--font-title); font-size: 1.35rem; font-weight: 600; line-height: 1.1; }
      .top .sub { display: block; font-family: var(--font-hand); font-size: 1.05rem; color: var(--ink-soft); font-weight: 400; }

      /* The demo strip: a note clipped to the top of the notebook */
      .demo-strip { margin: var(--space-1) var(--space-3) var(--space-2); padding: var(--space-2) var(--space-3); background: var(--paper-note); border: 1.5px dashed var(--estimated); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: center; }
      .demo-strip p { font-size: var(--text-sm); line-height: 1.35; }
      .demo-strip b.k { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; color: var(--estimated-text); margin-right: .35rem; }
      .demo-strip .make { font-size: var(--text-sm); font-weight: 600; color: var(--confirmed); white-space: nowrap; }
      .who-as { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; font-size: var(--text-xs); color: var(--ink-soft); }
      .who-as .chip { min-height: 1.8rem; padding: 0 .65rem; font-size: var(--text-xs); }

      .budget { padding: var(--space-2) var(--space-4) var(--space-3); }
      .budget__row { display: flex; align-items: baseline; justify-content: space-between; }
      .budget__fig { font-family: var(--font-title); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .budget__words { font-size: var(--text-md); color: var(--ink-soft); }
      .budget .hand-bar { height: 16px; margin-top: var(--space-2); }
      .legend { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--ink-soft); margin-top: .3rem; font-variant-numeric: tabular-nums; }
      .legend b { color: var(--confirmed); }
      .legend b.est { color: var(--estimated-text); }

      .place { margin: var(--space-3) var(--space-3) 0; padding: 0 var(--space-4) var(--space-3); }
      .place__head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) 0 var(--space-2); border-bottom: 1px solid var(--line); }
      .pin { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--confirmed); color: var(--paper); display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
      .place__head h2 { flex: 1; font-family: var(--font-title); font-size: 1.3rem; font-weight: 600; }
      .place__head h2 small { font-family: var(--font-text); font-size: var(--text-sm); color: var(--ink-soft); font-weight: 500; margin-left: .3rem; }
      .place__head b { font-variant-numeric: tabular-nums; }
      .item-group__label { margin-top: var(--space-3); }
      .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .4rem; vertical-align: .1em; background: var(--confirmed); }
      .dot--est { background: var(--estimated); }
      .gone { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--ink-soft); font-style: italic; }

      .nav { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--paper); padding: .5rem 0 .7rem; font-size: .7rem; text-align: center; color: var(--ink-soft); }
      .nav b { color: var(--ink); }
      .phone--nav { padding-bottom: 4.5rem; position: relative; }

      /* Tapping a line in the demo */
      .peek { margin: var(--space-2) 0; padding: var(--space-3); border: 1.5px dashed var(--line); border-radius: 10px; background: var(--paper); }
      .peek .line { border: 0; padding: 0; }
      .peek dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem var(--space-3); font-size: var(--text-sm); margin-top: var(--space-2); }
      .peek dt { color: var(--ink-soft); }
      .peek .hand { font-size: 1.1rem; margin-top: var(--space-2); }

      /* The end of the demo */
      .end { margin: var(--space-6) var(--space-3) 0; padding: var(--space-6) var(--space-4) var(--space-4); text-align: center; }
      .end h2 { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; }
      .end p { font-size: var(--text-md); color: var(--ink-soft); margin-top: var(--space-1); line-height: 1.45; }
      .end .button { width: 100%; margin-top: var(--space-4); }
      .end .quiet { display: block; margin-top: var(--space-3); font-size: var(--text-sm); font-weight: 600; color: var(--confirmed); }
      figcaption ul { margin: var(--space-2) 0 0 1rem; }
      figcaption li { margin-top: .25rem; }
    </style>
  </head>
  <body>
    <div class="phones">

      <!-- 1. Opening the demo -->
      <figure>
        <div class="phone phone--nav">
          <header class="top"><span class="back">‹</span><h1>Colombia &amp; Panama<span class="sub">4 – 18 Sept 2026 · 4 travellers</span></h1><span class="avatars"><span class="avatar avatar--me">A</span><span class="avatar">B</span><span class="avatar">C</span><span class="avatar">E</span></span></header>
          <div class="demo-strip">
            <p><b class="k">Demo</b>A real trip, the names changed. Look around: nothing you do here is saved.</p>
            <span class="make">Make my own ›</span>
            <div class="who-as">See it as <button class="chip" aria-pressed="true">Ana</button><button class="chip" aria-pressed="false">Bea</button><button class="chip" aria-pressed="false">Cleo</button><button class="chip" aria-pressed="false">Eva</button></div>
          </div>
          <section class="budget">
            <div class="budget__row"><span class="budget__fig">3 519 €</span><span class="budget__words"><span class="u">Ana’s share</span> · total</span></div>
            <div class="hand-bar" data-confirmed="0.99" data-estimated="0.01"><svg></svg></div>
            <div class="legend"><span><b>3 494 €</b> confirmed</span><span><b class="est">25 €</b> still estimated</span></div>
          </section>
          <div class="sketch-box sketch-box--light place" data-seed="31">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="place__head"><span class="pin">1</span><h2>Bogotá<small>2 nights</small></h2><b>119 €</b></header>
            <p class="item-group__label">Stay</p>
            <div class="line"><span><span class="line__name"><span class="dot"></span>Grand Hyatt Bogotá</span><span class="line__meta">Stay · days 1–3</span></span><span class="line__amount">in the<span class="line__tag" style="color:var(--chosen)">Package</span></span></div>
            <p class="item-group__label">Day 2</p>
            <div class="line"><span><span class="line__name"><span class="dot"></span>Andrés DC</span><span class="line__meta">Food · dinner</span></span><span class="line__amount">45 €<span class="line__tag line__tag--ok">Paid</span></span></div>
            <p class="gone">no “+ Add”, no “Edit” in the demo</p>
          </div>
          <nav class="nav"><span><b>Trip</b></span><span>Compare</span><span>Budget</span><span>Who paid</span></nav>
        </div>
        <figcaption><b>1 · Opening the demo</b> (“Try it with a real trip” on the welcome page, no sign-up). The real Colombia &amp; Panama, read-only:
          <ul>
            <li><b>A note clipped at the top</b>: it’s a demo, a real trip, names changed, nothing is saved; “Make my own ›” goes to sign-up.</li>
            <li><b>Added: “See it as Ana · Bea · Cleo · Eva”.</b> Tap a name and every amount becomes that person’s share. It shows in one tap what makes the app different.</li>
            <li>Everything to look at stays: the route map, Compare, Budget, Who paid. Everything to change is hidden: + Add, Edit, settings, Day ▾.</li>
          </ul>
        </figcaption>
      </figure>

      <!-- 2. Tapping a line -->
      <figure>
        <div class="phone phone--nav">
          <header class="top"><span class="back">‹</span><h1>Colombia &amp; Panama<span class="sub">4 – 18 Sept 2026 · 4 travellers</span></h1></header>
          <div class="sketch-box sketch-box--light place" data-seed="33">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <header class="place__head"><span class="pin">3</span><h2>Medellín<small>4 nights</small></h2><b>402 €</b></header>
            <p class="item-group__label">Day 7</p>
            <div class="peek">
              <div class="line"><span><span class="line__name"><span class="dot"></span>Comuna 13 tour</span><span class="line__meta">Activities · day 7</span></span><span class="line__amount">18 €<span class="line__tag line__tag--ok">Paid</span></span></div>
              <dl>
                <dt>Whole price</dt><dd>72 € for 4</dd>
                <dt>Who it’s for</dt><dd>everyone, 18 € each</dd>
                <dt>Paid by</dt><dd>Bea, 2 Sept</dd>
              </dl>
              <p class="hand">in your own notebook, this is where you’d change it</p>
            </div>
            <div class="line"><span><span class="line__name"><span class="dot dot--est"></span>Carmen</span><span class="line__meta">Food · dinner</span></span><span class="line__amount">64 €<span class="line__tag">Booked</span></span></div>
          </div>
          <nav class="nav"><span><b>Trip</b></span><span>Compare</span><span>Budget</span><span>Who paid</span></nav>
        </div>
        <figcaption><b>2 · Tapping a line.</b> Instead of the form to change it, the line opens to <b>show its details</b>: the whole price, who it’s for, who paid. A handwritten note says that in your own notebook, this is where you’d change it. Compare works the same way: you see the options and which one is circled, but you can’t circle another.</figcaption>
      </figure>

      <!-- 3. The end -->
      <figure>
        <div class="phone phone--nav">
          <header class="top"><span class="back">‹</span><h1>Who paid what<span class="sub">Colombia &amp; Panama · demo</span></h1></header>
          <div class="sketch-box sketch-box--light card card--hero" data-seed="41" style="margin:var(--space-3)">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <p>Eva pays Ana</p><b>69 €</b><span>photoshoot + a quarter of the Ubers</span>
          </div>
          <div class="sketch-box sketch-box--strong end" data-seed="42">
            <svg class="sketch-box__line" aria-hidden="true"></svg>
            <span class="tape tape--mustard" aria-hidden="true"></span>
            <h2>Your turn?</h2>
            <p>Start your own notebook: your trip, your people, each with their share. It’s free.</p>
            <a class="button button--primary">Create my notebook</a>
            <span class="quiet">Back to the welcome page</span>
          </div>
          <nav class="nav"><span>Trip</span><span>Compare</span><span>Budget</span><span><b>Who paid</b></span></nav>
        </div>
        <figcaption><b>3 · At the bottom of every demo page</b>, a sheet with the tape: <b>“Your turn?”</b> → Create my notebook, or back to the welcome page.
          <ul>
            <li><b>What changes in the copy:</b> the 4 names (Djamina → Ana, Danielle → Bea, Peggy → Cleo, Gabriel → Eva), and <b>all notes and links are removed</b> (they could be personal). The amounts, places, hotels and restaurants stay real.</li>
            <li>It’s a <b>copy made once</b>: if Colombia changes later, I make the copy again.</li>
          </ul>
        </figcaption>
      </figure>

    </div>
    <script>
      const only = new URLSearchParams(location.search).get('only')
      if (only) document.querySelectorAll('.phones > figure').forEach((f, i) => { if (!only.split(',').includes(String(i + 1))) f.remove() })
    </script>
  </body>
</html>
